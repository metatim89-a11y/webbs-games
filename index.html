<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby | Webbs Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="admin-gear" class="admin-only" onclick="toggleAdminSettings()">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="gold" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </div>

    <div id="lobby-container">
        <h1>Webbs Games</h1>
        
        <div id="player-select" class="player-grid">
            <div class="player-card" onclick="initLogin('arieal')"><h3>Arieal</h3></div>
            <div class="player-card" onclick="initLogin('az')"><h3>AZ</h3></div>
            <div class="player-card" onclick="initLogin('cassie')"><h3>Cassie</h3></div>
            <div class="player-card" onclick="initLogin('tim')"><h3>Tim</h3></div>
            <div class="player-card" onclick="initLogin('guest')"><h3>Guest</h3></div>
        </div>

        <div id="main-menu" style="display:none;">
            <div class="menu-actions" style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button onclick="showGameSelection('online')">Create Table</button>
                <button onclick="joinTablePrompt()">Join Table</button>
                <button onclick="showGameSelection('local')">Play Games</button>
            </div>
            
            <div id="message-board-container">
                <h3>Family Chat</h3>
                <div id="messages" style="height: 200px; overflow-y: auto; background: rgba(0,0,0,0.2); margin-bottom: 10px; padding: 10px; border-radius: 5px; text-align: left;"></div>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="msg-input" placeholder="Type a message..." style="flex: 1;">
                    <button onclick="postMessage()">Post</button>
                </div>
            </div>
        </div>
    </div>

    <div id="pin-overlay" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center;">
        <div class="pin-box" style="background: var(--secondary-color); padding: 20px; border-radius: 15px; border: 2px solid var(--primary-color); text-align: center;">
            <h2 id="pin-msg">Enter PIN</h2>
            <div style="display: flex; align-items: center; justify-content: center; gap: 15px; margin: 20px 0;">
                <div id="pin-display" style="font-size: 2.5em; letter-spacing: 8px; min-width: 120px;">----</div>
                <button type="button" onclick="togglePinVisibility()" style="background:none; border:1px solid gold; color:gold; cursor:pointer; font-size:1em; padding: 5px 10px; border-radius: 5px;">ⓘ</button>
            </div>
            <div class="keypad" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;">
                <button onclick="appendPin('1')">1</button><button onclick="appendPin('2')">2</button><button onclick="appendPin('3')">3</button>
                <button onclick="appendPin('4')">4</button><button onclick="appendPin('5')">5</button><button onclick="appendPin('6')">6</button>
                <button onclick="appendPin('7')">7</button><button onclick="appendPin('8')">8</button><button onclick="appendPin('9')">9</button>
                <button onclick="clearPin()">C</button><button onclick="appendPin('0')">0</button><button onclick="submitPin()">OK</button>
            </div>
            <button onclick="closePinOverlay()">Cancel</button>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="auth.js"></script>
    <script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wubs Games | Lobby</title>
    <link rel="stylesheet" href="style.css?v=1.3.2">
</head>
<body class="theme-guest">
    <div id="version-tag">v1.3.2</div>
    
    <div id="lobby-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="margin: 0;">Wubs Games</h1>
            <div id="admin-gear" class="admin-only" onclick="toggleAdminSettings()">
                <img src="assets/icons/settings.svg" width="30" height="30" alt="Admin" style="filter: invert(1);">
            </div>
        </div>

        <div id="logout-btn" style="display:none; cursor: pointer; color: #ff5555; margin-bottom: 20px; text-align: left;" onclick="logout()">Logout</div>

        <!-- Initial View: Player Select -->
        <div id="player-select-container">
            <p>Who is playing today?</p>
            <div id="player-select" class="player-grid"></div>
            <div id="guest-actions" style="margin-top: 20px;">
                <button onclick="openSignup()" style="background: none; border: 1px solid var(--accent-color); color: var(--accent-color); padding: 10px 20px; border-radius: 10px; width: 100%;">Request Profile</button>
            </div>
        </div>

        <!-- Logged In View: Main Menu -->
        <div id="main-menu" style="display: none;">
            <div id="welcome-banner" style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 20px; border: 2px solid var(--primary-color); margin-bottom: 30px;">
                <h2 id="active-player-name" style="margin: 0; color: var(--accent-color);">Welcome!</h2>
                <div style="display: flex; justify-content: center; gap: 10px; margin-top: 15px;">
                    <button onclick="openProfile()" class="modal-btn" style="font-size: 0.9em; padding: 10px 20px;">Profile</button>
                    <button onclick="showGameSelection('local')" class="modal-btn" style="font-size: 0.9em; padding: 10px 20px;">Play Games</button>
                </div>
            </div>

            <div id="online-actions" style="margin-top: 20px;">
                <button onclick="showGameSelection('online')" class="modal-btn" style="width: 100%; margin: 5px 0;">Host Online Table</button>
                <button onclick="joinTablePrompt()" class="modal-btn" style="width: 100%; margin: 5px 0; background: rgba(255,215,0,0.2); color: gold; border: 1px solid gold;">Join with PIN</button>
            </div>

            <!-- Message Board -->
            <div id="message-board-container" style="margin-top: 30px;">
                <h3>Family Chat</h3>
                <div id="messages" style="height: 150px; overflow-y: auto; background: rgba(0,0,0,0.2); margin-bottom: 10px; padding: 10px; border-radius: 10px; text-align: left;"></div>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="msg-input" placeholder="Say hello..." style="flex: 1; padding: 12px; border-radius: 12px; border: none; background: rgba(255,255,255,0.1); color: white;">
                    <button onclick="postMessage()" style="padding: 0 20px; border-radius: 12px; background: var(--primary-color); color: white; border: none;">Send</button>
                </div>
            </div>
        </div>

        <!-- Modals -->
        <div id="signup-modal" class="game-over-modal">
            <div class="modal-content" style="text-align: left;">
                <h2 style="color: gold;">Request Profile</h2>
                <input type="text" id="signup-name" placeholder="Your Name" style="width: 90%; padding: 12px; margin: 10px 0; border-radius: 10px; background: #333; color: white; border: none;">
                <input type="text" id="signup-animal" placeholder="Fav Animal (Background)" style="width: 90%; padding: 12px; margin: 10px 0; border-radius: 10px; background: #333; color: white; border: none;">
                <input type="text" id="signup-game" placeholder="Fav Game" style="width: 90%; padding: 12px; margin: 10px 0; border-radius: 10px; background: #333; color: white; border: none;">
                <div style="margin: 15px 0;">
                    <label style="font-size: 0.8em; opacity: 0.7;">Theme Colors:</label><br>
                    <div style="display: flex; gap: 10px; margin-top: 5px;">
                        <input type="color" id="signup-color-1" value="#ff0000" style="flex: 1; height: 40px; border: none; background: none; cursor: pointer;">
                        <input type="color" id="signup-color-2" value="#000000" style="flex: 1; height: 40px; border: none; background: none; cursor: pointer;">
                        <input type="color" id="signup-color-3" value="#ffffff" style="flex: 1; height: 40px; border: none; background: none; cursor: pointer;">
                    </div>
                </div>
                <button onclick="submitSignup()" class="modal-btn" style="width: 100%;">Submit Request</button>
                <button onclick="closeSignup()" class="modal-btn" style="background:none; width: 100%;">Cancel</button>
            </div>
        </div>

        <div id="join-game-modal" class="game-over-modal">
            <div class="modal-content">
                <div id="join-step-1">
                    <h3>Join with Table PIN</h3>
                    <p style="font-size: 0.8em; opacity: 0.7; margin-bottom: 20px;">We'll find the game for you!</p>
                    <input type="number" id="join-table-pin" pattern="[0-9]*" placeholder="0000" style="font-size: 2.5em; width: 80%; text-align: center; letter-spacing: 10px; padding: 15px; border-radius: 15px; border: none; margin-bottom: 20px; background: #333; color: white;">
                    <div id="join-status" style="margin-bottom: 20px; color: gold; font-weight: bold; min-height: 1.2em;"></div>
                    <button id="join-btn-final" onclick="performAutoJoin()" class="modal-btn">Join Table</button>
                    <button onclick="closeJoinModal()" class="modal-btn" style="background:none;">Cancel</button>
                </div>
            </div>
        </div>

        <div id="profile-modal" class="game-over-modal">
            <div class="modal-content" style="text-align: left;">
                <h2 id="profile-title" style="color: gold;">Profile</h2>
                <div id="profile-view">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px;">
                        <div>
                            <div style="font-size: 0.7em; opacity: 0.6;">WINS</div>
                            <div id="stat-wins" style="font-size: 1.5em; font-weight: bold; color: #5f5;">0</div>
                        </div>
                        <div>
                            <div style="font-size: 0.7em; opacity: 0.6;">LOSSES</div>
                            <div id="stat-losses" style="font-size: 1.5em; font-weight: bold; color: #f55;">0</div>
                        </div>
                    </div>
                    <p><strong>Fav Animal:</strong> <span id="view-animal">--</span></p>
                    <p><strong>Fav Game:</strong> <span id="view-game">--</span></p>
                    <button onclick="toggleProfileEdit(true)" class="modal-btn" style="width: 100%;">Edit Bio</button>
                </div>
                <div id="profile-edit" style="display:none;">
                    <input type="text" id="edit-animal" placeholder="Animal" style="width:90%; padding:12px; margin:5px 0; border-radius: 10px; background: #333; color: white; border: none;">
                    <input type="text" id="edit-game" placeholder="Game" style="width:90%; padding:12px; margin:5px 0; border-radius: 10px; background: #333; color: white; border: none;">
                    <button onclick="saveProfile()" class="modal-btn" style="width: 100%;">Save Changes</button>
                </div>
                <button onclick="closeProfile()" class="modal-btn" style="background:none; width:100%;">Close</button>
            </div>
        </div>

        <div id="pin-overlay" class="game-over-modal">
            <div class="modal-content">
                <h2 id="pin-msg">Enter PIN</h2>
                <div id="pin-display" style="font-size: 3em; letter-spacing: 15px; margin: 20px 0; font-weight: bold; color: gold;">----</div>
                <div style="margin-bottom: 20px;">
                    <button class="modal-btn" style="background:none; border: 1px solid gold; color: gold; font-size: 0.8em; padding: 5px 15px;" onclick="togglePinVisibility()">Show PIN</button>
                </div>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 250px; margin: 0 auto;">
                    <button class="modal-btn" onclick="appendPin('1')">1</button>
                    <button class="modal-btn" onclick="appendPin('2')">2</button>
                    <button class="modal-btn" onclick="appendPin('3')">3</button>
                    <button class="modal-btn" onclick="appendPin('4')">4</button>
                    <button class="modal-btn" onclick="appendPin('5')">5</button>
                    <button class="modal-btn" onclick="appendPin('6')">6</button>
                    <button class="modal-btn" onclick="appendPin('7')">7</button>
                    <button class="modal-btn" onclick="appendPin('8')">8</button>
                    <button class="modal-btn" onclick="appendPin('9')">9</button>
                    <button class="modal-btn" style="background: #444;" onclick="clearPin()">C</button>
                    <button class="modal-btn" onclick="appendPin('0')">0</button>
                    <button class="modal-btn" style="background: gold; color: black;" onclick="submitPin()">OK</button>
                </div>
                <button class="modal-btn" style="background:none; margin-top: 20px;" onclick="closePinOverlay()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="network.js?v=1.3.2"></script>
    <script src="profile.js?v=1.3.2"></script>
    <script src="audio.js?v=1.3.2"></script>
    <script src="admin.js?v=1.3.2"></script>
    <script src="auth.js?v=1.3.2"></script>
    <script src="main.js?v=1.3.2"></script>
</body>
</html>

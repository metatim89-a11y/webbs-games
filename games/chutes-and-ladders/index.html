<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chutes & Ladders | Webbs Games</title>
    <link rel="stylesheet" href="../../style.css?v=1.1.0">
    <style>
        #board {
            display: grid;
            grid-template-columns: repeat(10, 32px);
            grid-template-rows: repeat(10, 32px);
            gap: 2px;
            margin: 20px auto;
            background: #444;
            border: 5px solid #222;
            width: fit-content;
        }
        .sq {
            width: 32px; height: 32px;
            background: #fff; color: #ccc;
            font-size: 8px; display: flex;
            align-items: center; justify-content: center;
            position: relative;
        }
        .sq.special { background: #ffe0b2; color: #fb8c00; font-weight: bold; }
        .pawn {
            width: 20px; height: 20px;
            background: var(--accent-color);
            border-radius: 50%;
            border: 2px solid #000;
            position: absolute;
            z-index: 10;
            transition: all 0.4s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="lobby-container">
        <!-- Prominent PIN Display for Host -->
        <div id="host-pin-display" style="display: none; background: rgba(255, 215, 0, 0.2); border: 2px solid gold; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
            <div style="font-size: 0.8em; text-transform: uppercase; color: gold;">Share this PIN to invite players:</div>
            <div id="table-pin-value" style="font-size: 2.5em; font-weight: bold; letter-spacing: 5px; color: white;">----</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <button onclick="location.href='../../index.html'">← Back</button>
            <div id="network-status" style="font-size: 0.9em; color: gold;"></div>
        </div>

        <h1>Chutes & Ladders</h1>
        <p id="turn-info">Your Turn</p>

        <div id="multiplayer-controls" style="margin-bottom: 20px; display: none;">
            <button id="btn-join-game" onclick="requestToJoin()">Join as Player 2</button>
        </div>

        <div id="board"></div>
        <div id="controls" style="margin-top:20px;">
            <h2 id="dice-result">🎲 ?</h2>
            <button id="roll-btn" onclick="handleRoll()">Spin / Roll</button>
            <button id="reset-btn" onclick="resetGame()">Reset</button>
        </div>

        <!-- Table Chat -->
        <div id="table-chat-container" style="margin-top: 30px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; max-width: 400px; margin-left: auto; margin-right: auto;">
            <h3 style="margin-top: 0;">Table Chat</h3>
            <div id="table-messages" style="height: 150px; overflow-y: auto; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px; text-align: left; margin-bottom: 10px; display: flex; flex-direction: column;"></div>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="table-msg-input" placeholder="Chat with the table..." style="flex: 1; padding: 5px; border-radius: 5px; border: none; background: rgba(255,255,255,0.1); color: white;">
                <button onclick="sendTableChat()" style="padding: 5px 15px;">Send</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="../../network.js?v=1.1.0"></script>
    <script src="../../profile.js?v=1.1.0"></script>
    <script>
        let p1Pos = 1, p2Pos = 1;
        let currentPlayer = "X"; // X = Player 1, O = Player 2
        let active = true;
        let myRole = 'local';
        let isSpectator = false;
        let player2ID = null;

        const specials = {
            1: 38, 4: 14, 9: 31, 21: 42, 28: 84, 36: 44, 51: 67, 71: 91, 80: 100, // Ladders
            16: 6, 47: 26, 49: 11, 56: 53, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 78 // Chutes
        };

        const urlParams = new URLSearchParams(window.location.search);
        const playerID = urlParams.get('player') || 'guest';
        const gameType = urlParams.get('type');
        const networkRole = urlParams.get('role');
        const hostPIN = urlParams.get('host');

        document.body.classList.add('theme-' + playerID);

        window.onload = () => {
            initBoard();
            if (gameType === 'online') setupMultiplayer();
            updateStatus();
        };

        function setupMultiplayer() {
            if (networkRole === 'host') {
                myRole = 'host';
                NetworkManager.init('host');
                NetworkManager.peer.on('open', (id) => {
                    document.getElementById('network-status').innerText = `Table PIN: ${id}`;
                    document.getElementById('host-pin-display').style.display = 'block';
                    document.getElementById('table-pin-value').innerText = id;
                });
                NetworkManager.onPlayerJoined = (id, conn) => {
                    if (!player2ID) {
                        player2ID = id;
                        conn.send({ type: 'JOIN_ACCEPTED' });
                        broadcast();
                    }
                };
                NetworkManager.onMoveReceived = (roll) => {
                    if (currentPlayer === "O") executeRoll(roll);
                };
            } else {
                isSpectator = true;
                document.getElementById('multiplayer-controls').style.display = 'block';
                NetworkManager.init('client', hostPIN);
                NetworkManager.onStateUpdate = (state) => {
                    p1Pos = state.p1Pos; p2Pos = state.p2Pos;
                    currentPlayer = state.currentPlayer;
                    player2ID = state.player2ID;
                    active = state.active;
                    if (player2ID === playerID) {
                        isSpectator = false;
                        myRole = 'player2';
                        document.getElementById('multiplayer-controls').style.display = 'none';
                    }
                    movePawn('p1', p1Pos);
                    movePawn('p2', p2Pos);
                    updateStatus();
                };
                NetworkManager.onJoinAccepted = () => {
                    isSpectator = false;
                    myRole = 'player2';
                    document.getElementById('multiplayer-controls').style.display = 'none';
                };
                document.getElementById('network-status').innerText = `Spectating PIN: ${hostPIN}`;
            }
            NetworkManager.onChatMessage = (payload) => renderTableMessage(payload);
        }

        function requestToJoin() { NetworkManager.requestJoin(); }
        function broadcast() { if (myRole === 'host') NetworkManager.broadcastState({ p1Pos, p2Pos, currentPlayer, player2ID, active }); }

        function initBoard() {
            const boardEl = document.getElementById('board');
            for (let r = 9; r >= 0; r--) {
                for (let c = 0; c < 10; c++) {
                    let num = (r % 2 === 0) ? (r * 10 + c + 1) : (r * 10 + (9 - c) + 1);
                    const sq = document.createElement('div');
                    sq.className = 'sq' + (specials[num] ? ' special' : '');
                    sq.id = 'sq-' + num;
                    sq.innerText = num;
                    boardEl.appendChild(sq);
                }
            }
            
            createPawn('p1', 'var(--accent-color)');
            createPawn('p2', '#ff5555');
            
            setTimeout(() => {
                movePawn('p1', 1);
                movePawn('p2', 1);
            }, 100);
        }

        function createPawn(id, color) {
            const pawn = document.createElement('div');
            pawn.id = 'pawn-' + id;
            pawn.className = 'pawn';
            pawn.style.background = color;
            if (id === 'p2') pawn.style.transform = "translateX(5px) translateY(5px)";
            document.body.appendChild(pawn);
        }

        function movePawn(id, pos) {
            const sq = document.getElementById('sq-' + pos);
            const pawn = document.getElementById('pawn-' + id);
            if (!sq || !pawn) return;
            const rect = sq.getBoundingClientRect();
            pawn.style.left = (window.scrollX + rect.left + 6) + 'px';
            pawn.style.top = (window.scrollY + rect.top + 6) + 'px';
        }

        function handleRoll() {
            if (isSpectator || !active) return;
            if (myRole === 'host' && currentPlayer !== "X") return;
            if (myRole === 'player2' && currentPlayer !== "O") return;

            const roll = Math.floor(Math.random() * 6) + 1;
            if (myRole === 'player2') {
                NetworkManager.sendMove(roll);
            } else {
                executeRoll(roll);
            }
        }

        function executeRoll(roll) {
            document.getElementById('dice-result').innerText = "🎲 " + roll;
            let current = (currentPlayer === "X") ? p1Pos : p2Pos;
            
            if (current + roll <= 100) {
                current += roll;
                if (currentPlayer === "X") p1Pos = current; else p2Pos = current;
                movePawn(currentPlayer === "X" ? 'p1' : 'p2', current);
                
                setTimeout(() => {
                    if (specials[current]) {
                        current = specials[current];
                        if (currentPlayer === "X") p1Pos = current; else p2Pos = current;
                        movePawn(currentPlayer === "X" ? 'p1' : 'p2', current);
                    }
                    if (current === 100) {
                        active = false;
                        document.getElementById('status').innerText = (currentPlayer === "X" ? "Player 1" : "Player 2") + " Wins!";
                        
                        if (gameType === 'online') {
                            const iWon = (myRole === 'host' && currentPlayer === 'X') || (myRole === 'player2' && currentPlayer === 'O');
                            ProfileManager.recordResult('Chutes & Ladders', playerID, (myRole === 'host' ? player2ID : 'host'), iWon ? 'win' : 'loss');
                        } else if (gameType !== 'local') {
                            ProfileManager.recordResult('Chutes & Ladders', playerID, 'CPU', currentPlayer === 'X' ? 'win' : 'loss');
                        }
                    } else {
                        currentPlayer = (currentPlayer === "X") ? "O" : "X";
                    }
                    broadcast();
                    updateStatus();
                }, 500);
            } else {
                currentPlayer = (currentPlayer === "X") ? "O" : "X";
                broadcast();
                updateStatus();
            }
        }

        function updateStatus() {
            const statusEl = document.getElementById('turn-info');
            if (!active) return;
            let turnText = currentPlayer === "X" ? "Player 1's Turn" : "Player 2's Turn";
            if (myRole === 'host' && currentPlayer === "X") turnText += " (YOU)";
            if (myRole === 'player2' && currentPlayer === "O") turnText += " (YOU)";
            if (isSpectator) turnText += " (Spectating)";
            statusEl.innerText = turnText;
            document.getElementById('roll-btn').disabled = (myRole === 'host' && currentPlayer !== 'X') || (myRole === 'player2' && currentPlayer !== 'O') || isSpectator;
        }

        function resetGame() {
            if (isSpectator || myRole === 'player2') return;
            p1Pos = 1; p2Pos = 1; currentPlayer = "X"; active = true;
            document.getElementById('status').innerText = "Chutes & Ladders";
            movePawn('p1', 1); movePawn('p2', 1);
            broadcast();
            updateStatus();
        }

        // --- Table Chat Logic ---
        function sendTableChat() {
            const input = document.getElementById('table-msg-input');
            const text = input.value.trim();
            if (!text) return;
            NetworkManager.sendChatMessage(text);
            input.value = "";
        }
        function renderTableMessage(payload) {
            const container = document.getElementById('table-messages');
            const div = document.createElement('div');
            div.style.css?v=1.1.0Text = "margin-bottom:5px; padding:5px; border-radius:5px; font-size:0.9em; background:rgba(255,255,255,0.05);";
            const name = payload.sender ? payload.sender.toUpperCase() : "GUEST";
            div.innerHTML = `<strong>${name}:</strong> ${payload.text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        document.getElementById('table-msg-input')?.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendTableChat(); });
    </script>
</body>
</html>

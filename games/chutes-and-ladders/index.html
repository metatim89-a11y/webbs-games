<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chutes & Ladders | Webbs Games</title>
    <link rel="stylesheet" href="../../style.css?v=1.4.5">
    <style>
        #board-wrapper { 
            position: relative; width: 400px; height: 400px; max-width: 95vw; aspect-ratio: 1/1; margin: 20px auto; 
            background: #222; border: 8px solid #333; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: visible;
        }
        @media (max-width: 500px) {
            #board-wrapper { height: auto; }
            h1 { font-size: 1.5em; margin: 10px 0; }
            #dice-container { width: 50px; height: 50px; font-size: 1.8em; }
            .sq { font-size: 6px; }
            .pawn { width: 18px; height: 18px; }
        }
        #board {
            display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr);
            width: 100%; height: 100%; position: relative; z-index: 10;
        }
        .sq {
            width: 100%; height: 100%; border: 1px solid rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.3); font-size: 8px; display: flex; 
            align-items: center; justify-content: center; position: relative;
            background: rgba(255,255,255,0.02);
        }
        .sq:nth-child(even) { background: rgba(255,255,255,0.04); }
        .sq.special { background: rgba(255, 215, 0, 0.05); color: gold; font-weight: bold; }
        
        .pawn {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid #000;
            position: absolute; z-index: 50; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .pawn::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%; background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 100%);
        }

        .trajectory { fill: none; stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 5px rgba(0,0,0,0.5)); }
        .ladder { stroke: url(#ladderGradient); stroke-dasharray: 10,5; animation: flow 2s linear infinite; }
        .chute { stroke: url(#chuteGradient); stroke-dasharray: 5,5; animation: flow 1s linear infinite reverse; }
        
        @keyframes flow { to { stroke-dashoffset: 30; } }

        .hop-anim { animation: hop 0.4s ease-out; }
        @keyframes hop {
            0% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.3) translateY(-15px); }
            100% { transform: scale(1) translateY(0); }
        }

        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        #dice-container {
            width: 70px; height: 70px; background: #fff; border-radius: 15px;
            margin: 20px auto; display: flex; align-items: center; justify-content: center;
            font-size: 2.5em; font-weight: bold; color: #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); transition: transform 0.2s;
        }
        .rolling { animation: diceRoll 0.1s infinite; }
        @keyframes diceRoll {
            0% { transform: rotate(0deg) scale(1.1) translate(2px, -2px); }
            50% { transform: rotate(5deg) scale(1) translate(-2px, 2px); }
            100% { transform: rotate(-5deg) scale(1.1) translate(0, 0); }
        }

        .particle {
            position: absolute; pointer-events: none; border-radius: 50%;
            z-index: 100; animation: particleAnim 0.8s ease-out forwards;
        }
        @keyframes particleAnim {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0) translateY(-50px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="version-tag">v1.4.5</div>

    <div class="rules-block" id="rules-block">
        <div class="rules-toggle" onclick="toggleRules()">
            <i class="info-icon">i</i>
            <span>Rules</span>
            <span class="rules-subtext">Need help?</span>
        </div>
        <div class="rules-content-mini" id="rules-content">
            <strong>Objective:</strong> Be the first to reach square 100.<br><br>
            <strong>Rules:</strong>
            <ul>
                <li>Spin to move.</li>
                <li>Ladders (Green) take you UP.</li>
                <li>Chutes (Red) send you DOWN.</li>
            </ul>
        </div>
    </div>

    <div id="game-over-modal" class="game-over-modal">
        <div class="modal-content">
            <div class="winner-announcement" id="winner-text">PLAYER 1 WINS!</div>
            <button class="modal-btn" onclick="resetGame()">Play Again</button>
            <button class="modal-btn" onclick="location.href='../../index.html'">Main Menu</button>
        </div>
    </div>

    <div id="lobby-container">
        <div id="host-pin-display" style="display: none; background: rgba(255, 215, 0, 0.2); border: 2px solid gold; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
            <div style="font-size: 0.8em; text-transform: uppercase; color: gold;">Share this PIN:</div>
            <div id="table-pin-value" style="font-size: 2.5em; font-weight: bold; letter-spacing: 5px; color: white;">----</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <button onclick="location.href='../../index.html'">← Back</button>
            <div id="network-status" style="font-size: 0.9em; color: gold;"></div>
        </div>

        <h1>Chutes & Ladders</h1>
        <p id="game-info" style="min-height: 1.2em; color: gold; font-weight: bold; margin-bottom: 5px;">Spin to start!</p>
        <p id="turn-info" style="font-weight: bold; color: var(--accent-color); margin-bottom: 10px;">Your Turn</p>

        <div id="multiplayer-controls" style="margin-bottom: 20px; display: none;">
            <button id="btn-join-game" onclick="NetworkManager.requestJoin()">Join as Player 2</button>
        </div>

        <div id="board-wrapper">
            <svg id="trajectories" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:20;">
                <defs>
                    <linearGradient id="ladderGradient" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#8bc34a;stop-opacity:1" />
                    </linearGradient>
                    <linearGradient id="chuteGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#f44336;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#ff9800;stop-opacity:1" />
                    </linearGradient>
                </defs>
            </svg>
            <div id="board"></div>
        </div>

        <div id="controls" style="margin-top:20px;">
            <div id="dice-container">?</div>
            <button id="roll-btn" class="modal-btn" onclick="handleRoll()">SPIN</button>
            <button id="reset-btn" class="modal-btn" style="background: rgba(255,255,255,0.1); margin-top: 10px;" onclick="resetGame()">Reset</button>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="../../network.js?v=1.4.5"></script>
    <script src="../../profile.js?v=1.4.5"></script>
    <script src="../../audio.js?v=1.4.5"></script>
    <script>
        let p1Pos = 1, p2Pos = 1;
        let currentPlayer = "X"; 
        let active = true;
        let myRole = 'local';
        let isSpectator = false;
        let player2ID = null;
        let startingPlayer = "X";

        const specials = {
            1: 38, 4: 14, 9: 31, 21: 42, 28: 84, 36: 44, 51: 67, 71: 91, 80: 100, // Ladders
            16: 6, 47: 26, 49: 11, 56: 53, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 78 // Chutes
        };
        let hiddenSpecials = {};

        const urlParams = new URLSearchParams(window.location.search);
        const playerID = urlParams.get('player') || 'guest';
        const gameType = urlParams.get('type');
        const networkRole = urlParams.get('role');
        const hostPIN = urlParams.get('host');

        document.body.classList.add('theme-' + playerID);

        function initHiddenSpecials() {
            if (networkRole === 'client') return;
            hiddenSpecials = {};
            const types = ['swap', 'back', 'forward', 'ladder'];
            const occupied = new Set([...Object.keys(specials).map(Number), ...Object.values(specials), 1, 100]);
            
            types.forEach(type => {
                let pos;
                let attempts = 0;
                do {
                    pos = Math.floor(Math.random() * 90) + 5;
                    attempts++;
                } while (occupied.has(pos) && attempts < 100);
                if (attempts < 100) {
                    hiddenSpecials[pos] = type;
                    occupied.add(pos);
                }
            });
        }

        function getNames() {
            const p1 = ProfileManager.resolveName(playerID);
            let p2 = "Player 2";
            if (gameType === 'cpu') p2 = "Computer";
            else if (gameType === 'online') p2 = ProfileManager.resolveName(player2ID || 'guest');
            return { p1, p2 };
        }

        window.onload = () => {
            initHiddenSpecials();
            initBoard();
            if (gameType === 'online') setupMultiplayer();
            updateStatus();
        };

        function toggleRules() {
            document.getElementById('rules-block').classList.toggle('expanded');
        }

        function setupMultiplayer() {
            if (networkRole === 'host') {
                myRole = 'host';
                NetworkManager.onPlayerJoined = (id, conn) => {
                    if (!player2ID) {
                        player2ID = id;
                        conn.send({ type: 'JOIN_ACCEPTED' });
                        broadcast();
                    }
                };
                NetworkManager.onMoveReceived = (roll) => { 
                    if (currentPlayer === "O") {
                        NetworkManager.broadcastAnimation({ type: 'ROLL', roll });
                        executeRoll(roll, true); 
                    }
                };
                NetworkManager.init('host');
                NetworkManager.peer.on('open', (id) => {
                    document.getElementById('network-status').innerText = `PIN: ${id}`;
                    document.getElementById('host-pin-display').style.display = 'block';
                    document.getElementById('table-pin-value').innerText = id;
                });
            } else {
                isSpectator = true;
                NetworkManager.onStateUpdate = (state) => {
                    p1Pos = state.p1Pos; p2Pos = state.p2Pos;
                    currentPlayer = state.currentPlayer;
                    player2ID = state.player2ID;
                    active = state.active;
                    if (state.hiddenSpecials) hiddenSpecials = state.hiddenSpecials;
                    if (player2ID === playerID) {
                        isSpectator = false;
                        myRole = 'player2';
                        document.getElementById('multiplayer-controls').style.display = 'none';
                    }
                    if (!active) showGameOver(currentPlayer === "X" ? "PLAYER 1" : "PLAYER 2");
                    movePawn('p1', p1Pos);
                    movePawn('p2', p2Pos);
                    updateStatus();
                };
                NetworkManager.onAnimationTrigger = (data) => {
                    if (data.type === 'ROLL') {
                        const isMyTurn = (myRole === 'host' && currentPlayer === 'X') || (myRole === 'player2' && currentPlayer === 'O');
                        if (!isMyTurn) executeRoll(data.roll, false);
                    }
                };
                NetworkManager.onJoinAccepted = () => {
                    isSpectator = false;
                    myRole = 'player2';
                    document.getElementById('multiplayer-controls').style.display = 'none';
                };
                NetworkManager.init('client', hostPIN);
            }
        }

        function broadcast() { if (myRole === 'host') NetworkManager.broadcastState({ p1Pos, p2Pos, currentPlayer, player2ID, active, hiddenSpecials }); }

        function initBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let r = 9; r >= 0; r--) {
                for (let c = 0; c < 10; c++) {
                    let num = (r % 2 === 0) ? (r * 10 + c + 1) : (r * 10 + (9 - c) + 1);
                    const sq = document.createElement('div');
                    sq.className = 'sq' + (specials[num] ? ' special' : '');
                    sq.id = 'sq-' + num;
                    sq.innerText = num;
                    boardEl.appendChild(sq);
                }
            }
            createPawn('p1', 'var(--accent-color)');
            createPawn('p2', '#ff5555');
            setTimeout(() => {
                drawTrajectories();
                movePawn('p1', 1);
                movePawn('p2', 1);
            }, 500);
        }

        function drawTrajectories() {
            const svg = document.getElementById('trajectories');
            svg.innerHTML = svg.querySelector('defs').outerHTML;
            const boardRect = document.getElementById('board-wrapper').getBoundingClientRect();
            
            Object.keys(specials).forEach(start => {
                const end = specials[start];
                const sEl = document.getElementById('sq-' + start);
                const eEl = document.getElementById('sq-' + end);
                const sRect = sEl.getBoundingClientRect();
                const eRect = eEl.getBoundingClientRect();
                
                const x1 = sRect.left - boardRect.left + (sRect.width / 2);
                const y1 = sRect.top - boardRect.top + (sRect.height / 2);
                const x2 = eRect.left - boardRect.left + (eRect.width / 2);
                const y2 = eRect.top - boardRect.top + (eRect.height / 2);

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const midX = (x1 + x2) / 2 + (Math.random() - 0.5) * (boardRect.width * 0.1);
                const midY = (y1 + y2) / 2 + (Math.random() - 0.5) * (boardRect.height * 0.1);
                
                path.setAttribute("d", `M ${x1} ${y1} Q ${midX} ${midY} ${x2} ${y2}`);
                path.setAttribute("class", "trajectory " + (end > start ? "ladder" : "chute"));
                svg.appendChild(path);
            });
        }

        window.addEventListener('resize', () => {
            drawTrajectories();
            movePawn('p1', p1Pos);
            movePawn('p2', p2Pos);
        });

        function createPawn(id, color) {
            const pawn = document.createElement('div');
            pawn.id = 'pawn-' + id;
            pawn.className = 'pawn';
            pawn.style.background = color;
            document.getElementById('board-wrapper').appendChild(pawn);
        }

        function movePawn(id, pos, animate = false) {
            const sq = document.getElementById('sq-' + pos);
            const pawn = document.getElementById('pawn-' + id);
            if (!sq || !pawn) return;
            const boardRect = document.getElementById('board-wrapper').getBoundingClientRect();
            const sqRect = sq.getBoundingClientRect();
            
            if (animate) {
                pawn.classList.remove('hop-anim');
                void pawn.offsetWidth;
                pawn.classList.add('hop-anim');
            }
            
            const offset = id === 'p1' ? 0.1 : 0.4;
            const left = sqRect.left - boardRect.left + (sqRect.width * offset);
            const top = sqRect.top - boardRect.top + (sqRect.height * offset);
            
            pawn.style.left = left + 'px';
            pawn.style.top = top + 'px';
            pawn.style.width = (sqRect.width * 0.4) + 'px';
            pawn.style.height = (sqRect.height * 0.4) + 'px';
        }

        const sleep = ms => new Promise(res => setTimeout(res, ms));

        function spawnParticles(x, y, color) {
            const wrapper = document.getElementById('board-wrapper');
            for(let i=0; i<8; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.background = color;
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.width = (Math.random() * 6 + 2) + 'px';
                p.style.height = p.style.width;
                wrapper.appendChild(p);
                setTimeout(() => p.remove(), 800);
            }
        }

        async function handleRoll(isProgrammatic = false) {
            if (!canMove() && !isProgrammatic) return;
            const roll = Math.floor(Math.random() * 6) + 1;
            if (myRole === 'player2') {
                NetworkManager.sendMove(roll);
                await executeRoll(roll, false);
            } else {
                if (myRole === 'host') NetworkManager.broadcastAnimation({ type: 'ROLL', roll });
                await executeRoll(roll, true);
            }
        }

        function canMove() {
            if (isSpectator || !active) return false;
            if (gameType === 'cpu' && currentPlayer === "O") return false;
            if (myRole === 'host' && currentPlayer !== "X") return false;
            if (myRole === 'player2' && currentPlayer !== "O") return false;
            return true;
        }

        async function executeRoll(roll, isLocal = true) {
            try {
                const dice = document.getElementById('dice-container');
                const rollBtn = document.getElementById('roll-btn');
                if (rollBtn) rollBtn.disabled = true;

                dice.classList.add('rolling');
                if (window.AudioManager) AudioManager.play('roll');
                for(let i=0; i<12; i++) {
                    dice.innerText = Math.floor(Math.random() * 6) + 1;
                    await sleep(60);
                }
                dice.classList.remove('rolling');
                dice.innerText = roll;
                
                let pId = currentPlayer === "X" ? 'p1' : 'p2';
                let current = (currentPlayer === "X") ? p1Pos : p2Pos;
                
                if (current + roll <= 100) {
                    for(let i=0; i<roll; i++) {
                        current++;
                        if (currentPlayer === "X") p1Pos = current; else p2Pos = current;
                        movePawn(pId, current, true);
                        if (window.AudioManager) AudioManager.play('move');
                        await sleep(350);
                    }
                    
                    if (specials[current]) {
                        const isLadder = specials[current] > current;
                        await sleep(400);
                        current = specials[current];
                        if (currentPlayer === "X") p1Pos = current; else p2Pos = current;
                        
                        const pawn = document.getElementById('pawn-' + pId);
                        if (pawn) spawnParticles(pawn.offsetLeft + 12, pawn.offsetTop + 12, isLadder ? '#4caf50' : '#f44336');
                        
                        if (!isLadder) document.getElementById('board-wrapper').classList.add('shake');
                        movePawn(pId, current, true);
                        if (window.AudioManager) AudioManager.play(isLadder ? 'climb' : 'slide');
                        await sleep(600);
                        document.getElementById('board-wrapper').classList.remove('shake');
                    }

                    if (hiddenSpecials[current]) {
                        const type = hiddenSpecials[current];
                        await sleep(600);
                        let message = "";
                        
                        if (type === 'swap') {
                            message = "HIDDEN SWAP!";
                            const tempP1 = p1Pos;
                            p1Pos = p2Pos;
                            p2Pos = tempP1;
                            movePawn('p1', p1Pos, true);
                            movePawn('p2', p2Pos, true);
                            current = (currentPlayer === "X") ? p1Pos : p2Pos;
                            if (window.AudioManager) AudioManager.play('slide');
                        } else {
                            let target = current;
                            if (type === 'back') {
                                message = "HIDDEN TRAP: BACK 5!";
                                target = Math.max(1, current - 5);
                                if (window.AudioManager) AudioManager.play('slide');
                            } else if (type === 'forward') {
                                message = "HIDDEN BOOST: FORWARD 5!";
                                target = Math.min(99, current + 5);
                                if (window.AudioManager) AudioManager.play('climb');
                            } else if (type === 'ladder') {
                                message = "HIDDEN SHORTCUT: TO NEAREST LADDER!";
                                let closest = -1;
                                let minDist = 101;
                                Object.keys(specials).forEach(s => {
                                    const start = parseInt(s);
                                    if (specials[start] > start) {
                                        let dist = Math.abs(start - current);
                                        if (dist < minDist) { minDist = dist; closest = start; }
                                    }
                                });
                                if (closest !== -1) target = closest;
                                if (window.AudioManager) AudioManager.play('climb');
                            }
                            current = target;
                            if (currentPlayer === "X") p1Pos = current; else p2Pos = current;
                            movePawn(pId, current, true);
                        }
                        
                        const info = document.getElementById('game-info');
                        if (info) {
                            info.innerText = message;
                            await sleep(1000);
                            info.innerText = "";
                        }

                        if (specials[current]) {
                            await sleep(400);
                            const isLadder = specials[current] > current;
                            current = specials[current];
                            if (currentPlayer === "X") p1Pos = current; else p2Pos = current;
                            movePawn(pId, current, true);
                            if (window.AudioManager) AudioManager.play(isLadder ? 'climb' : 'slide');
                            await sleep(600);
                        }
                    }
                    
                    if (current === 100) {
                        active = false;
                        const names = getNames();
                        showGameOver(currentPlayer === "X" ? names.p1 : names.p2);
                        if (window.AudioManager) AudioManager.play('win');
                        
                        const sessionPlayer = sessionStorage.getItem('webbs_active_player') || playerID;
                        if (gameType === 'online') {
                            const iWon = (myRole === 'host' && currentPlayer === 'X') || (myRole === 'player2' && currentPlayer === 'O');
                            ProfileManager.recordResult('Chutes & Ladders', sessionPlayer, (myRole === 'host' ? player2ID : 'host'), iWon ? 'win' : 'loss');
                        } else if (gameType === 'cpu') {
                            ProfileManager.recordResult('Chutes & Ladders', sessionPlayer, 'CPU', currentPlayer === 'X' ? 'win' : 'loss');
                        }
                    }
                }
                
                if (active) {
                    currentPlayer = (currentPlayer === "X") ? "O" : "X";
                    if (isLocal) broadcast();
                    updateStatus();
                    if (gameType === 'cpu' && currentPlayer === 'O' && isLocal) setTimeout(() => cpuMove(), 800);
                }
            } catch (err) {
                console.error(err);
                updateStatus();
            }
        }

        function cpuMove() { if (active) handleRoll(true); }

        function showGameOver(winner) {
            document.getElementById('winner-text').innerText = winner + " WINS!";
            document.getElementById('game-over-modal').style.display = 'flex';
            updateStatus();
        }

        function updateStatus() {
            const info = document.getElementById('turn-info');
            const rollBtn = document.getElementById('roll-btn');
            const names = getNames();
            if (!active) { if (rollBtn) rollBtn.disabled = true; return; }
            let text = currentPlayer === "X" ? `${names.p1}'s Turn` : `${names.p2}'s Turn`;
            const isMyTurn = (myRole === 'host' && currentPlayer === 'X') || (myRole === 'player2' && currentPlayer === 'O') || (myRole === 'local' && (gameType !== 'cpu' || currentPlayer === 'X'));
            if (isMyTurn) text = "YOUR TURN";
            info.innerText = text;
            if (rollBtn) rollBtn.disabled = !isMyTurn || isSpectator;
        }

        function resetGame() {
            if (gameType === 'online' && myRole !== 'host') return;
            document.getElementById('game-over-modal').style.display = 'none';
            initHiddenSpecials();
            p1Pos = 1; p2Pos = 1; active = true;
            startingPlayer = startingPlayer === "X" ? "O" : "X";
            currentPlayer = startingPlayer;
            movePawn('p1', 1); movePawn('p2', 1);
            if (myRole === 'host') broadcast();
            updateStatus();
            if (gameType === 'cpu' && currentPlayer === "O") setTimeout(cpuMove, 1000);
        }
    </script>
</body>
</html>

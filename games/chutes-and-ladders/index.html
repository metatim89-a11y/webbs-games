<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chutes & Ladders | Webbs Games</title>
    <link rel="stylesheet" href="../../style.css?v=1.3.6">
    <style>
        #board-wrapper { position: relative; width: fit-content; margin: 20px auto; }
        #board {
            display: grid; grid-template-columns: repeat(10, 32px); grid-template-rows: repeat(10, 32px);
            gap: 2px; background: #444; border: 5px solid #222;
        }
        .sq {
            width: 32px; height: 32px; background: #fff; color: #ccc;
            font-size: 8px; display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .sq.special { background: #ffe0b2; color: #fb8c00; font-weight: bold; }
        .pawn {
            width: 20px; height: 20px; background: var(--accent-color);
            border-radius: 50%; border: 2px solid #000; position: absolute;
            z-index: 20; transition: all 0.4s ease-in-out;
        }
        .trajectory {
            position: absolute; pointer-events: none; z-index: 5;
            stroke-dasharray: 5,5; stroke-width: 2;
        }
        .ladder { stroke: #4caf50; }
        .chute { stroke: #f44336; }
        
        #dice-container {
            width: 60px; height: 60px; background: white; border: 2px solid #444;
            border-radius: 10px; margin: 20px auto; display: flex;
            align-items: center; justify-content: center; font-size: 2em;
            color: #222; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .rolling { animation: diceRoll 0.1s infinite; }
        @keyframes diceRoll {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(10deg) scale(1.1); }
            100% { transform: rotate(-10deg) scale(1); }
        }
    </style>
</head>
<body>
    <div id="version-tag">v1.3.6</div>

    <div class="rules-block" id="rules-block">
        <div class="rules-toggle" onclick="toggleRules()">
            <i class="info-icon">i</i>
            <span>Rules</span>
            <span class="rules-subtext">Need help?</span>
        </div>
        <div class="rules-content-mini" id="rules-content">
            <strong>Objective:</strong> Be the first to reach square 100.<br><br>
            <strong>Rules:</strong>
            <ul>
                <li>Spin to move.</li>
                <li>Ladders (Green) take you UP.</li>
                <li>Chutes (Red) send you DOWN.</li>
            </ul>
        </div>
    </div>

    <div id="game-over-modal" class="game-over-modal">
        <div class="modal-content">
            <div class="winner-announcement" id="winner-text">PLAYER 1 WINS!</div>
            <button class="modal-btn" onclick="resetGame()">Play Again</button>
            <button class="modal-btn" onclick="location.href='../../index.html'">Main Menu</button>
        </div>
    </div>

    <div id="lobby-container">
        <div id="host-pin-display" style="display: none; background: rgba(255, 215, 0, 0.2); border: 2px solid gold; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
            <div style="font-size: 0.8em; text-transform: uppercase; color: gold;">Share this PIN:</div>
            <div id="table-pin-value" style="font-size: 2.5em; font-weight: bold; letter-spacing: 5px; color: white;">----</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <button onclick="location.href='../../index.html'">← Back</button>
            <div id="network-status" style="font-size: 0.9em; color: gold;"></div>
        </div>

        <h1>Chutes & Ladders</h1>
        <p id="turn-info" style="font-weight: bold; color: var(--accent-color);">Your Turn</p>

        <div id="multiplayer-controls" style="margin-bottom: 20px; display: none;">
            <button id="btn-join-game" onclick="NetworkManager.requestJoin()">Join as Player 2</button>
        </div>

        <div id="board-wrapper">
            <svg id="trajectories" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5;"></svg>
            <div id="board"></div>
        </div>

        <div id="controls" style="margin-top:20px;">
            <div id="dice-container">?</div>
            <button id="roll-btn" class="modal-btn" onclick="handleRoll()">Spin / Roll</button>
            <button id="reset-btn" class="modal-btn" style="background: rgba(255,255,255,0.1);" onclick="resetGame()">Reset</button>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="../../network.js?v=1.3.6"></script>
    <script src="../../profile.js?v=1.3.6"></script>
    <script src="../../audio.js?v=1.3.6"></script>
    <script>
        let p1Pos = 1, p2Pos = 1;
        let currentPlayer = "X"; 
        let active = true;
        let myRole = 'local';
        let isSpectator = false;
        let player2ID = null;
        let startingPlayer = "X";

        const specials = {
            1: 38, 4: 14, 9: 31, 21: 42, 28: 84, 36: 44, 51: 67, 71: 91, 80: 100, // Ladders
            16: 6, 47: 26, 49: 11, 56: 53, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 78 // Chutes
        };

        const urlParams = new URLSearchParams(window.location.search);
        const playerID = urlParams.get('player') || 'guest';
        const gameType = urlParams.get('type');
        const networkRole = urlParams.get('role');
        const hostPIN = urlParams.get('host');

        document.body.classList.add('theme-' + playerID);

        function getNames() {
            const p1 = ProfileManager.resolveName(playerID);
            let p2 = "Player 2";
            if (gameType === 'cpu') p2 = "Computer";
            else if (gameType === 'online') p2 = ProfileManager.resolveName(player2ID || 'guest');
            return { p1, p2 };
        }

        window.onload = () => {
            initBoard();
            if (gameType === 'online') setupMultiplayer();
            updateStatus();
        };

        function toggleRules() {
            document.getElementById('rules-block').classList.toggle('expanded');
        }

        function setupMultiplayer() {
            if (networkRole === 'host') {
                myRole = 'host';
                NetworkManager.onPlayerJoined = (id, conn) => {
                    if (!player2ID) {
                        player2ID = id;
                        conn.send({ type: 'JOIN_ACCEPTED' });
                        broadcast();
                    }
                };
                NetworkManager.onMoveReceived = (roll) => { 
                    if (currentPlayer === "O") {
                        NetworkManager.broadcastAnimation({ type: 'ROLL', roll });
                        executeRoll(roll, true); 
                    }
                };
                NetworkManager.init('host');
                NetworkManager.peer.on('open', (id) => {
                    document.getElementById('network-status').innerText = `PIN: ${id}`;
                    document.getElementById('host-pin-display').style.display = 'block';
                    document.getElementById('table-pin-value').innerText = id;
                });
            } else {
                isSpectator = true;
                NetworkManager.onStateUpdate = (state) => {
                    p1Pos = state.p1Pos; p2Pos = state.p2Pos;
                    currentPlayer = state.currentPlayer;
                    player2ID = state.player2ID;
                    active = state.active;
                    if (player2ID === playerID) {
                        isSpectator = false;
                        myRole = 'player2';
                        document.getElementById('multiplayer-controls').style.display = 'none';
                    }
                    if (!active) showGameOver(currentPlayer === "X" ? "PLAYER 1" : "PLAYER 2");
                    movePawn('p1', p1Pos);
                    movePawn('p2', p2Pos);
                    updateStatus();
                };
                NetworkManager.onAnimationTrigger = (data) => {
                    if (data.type === 'ROLL') {
                        const isMyTurn = (myRole === 'host' && currentPlayer === 'X') || (myRole === 'player2' && currentPlayer === 'O');
                        if (!isMyTurn) executeRoll(data.roll, false);
                    }
                };
                NetworkManager.onJoinAccepted = () => {
                    isSpectator = false;
                    myRole = 'player2';
                    document.getElementById('multiplayer-controls').style.display = 'none';
                };
                NetworkManager.init('client', hostPIN);
            }
        }

        function broadcast() { if (myRole === 'host') NetworkManager.broadcastState({ p1Pos, p2Pos, currentPlayer, player2ID, active }); }

        function initBoard() {
            const boardEl = document.getElementById('board');
            for (let r = 9; r >= 0; r--) {
                for (let c = 0; c < 10; c++) {
                    let num = (r % 2 === 0) ? (r * 10 + c + 1) : (r * 10 + (9 - c) + 1);
                    const sq = document.createElement('div');
                    sq.className = 'sq' + (specials[num] ? ' special' : '');
                    sq.id = 'sq-' + num;
                    sq.innerText = num;
                    boardEl.appendChild(sq);
                }
            }
            createPawn('p1', 'var(--accent-color)');
            createPawn('p2', '#ff5555');
            setTimeout(() => {
                drawTrajectories();
                movePawn('p1', 1);
                movePawn('p2', 1);
            }, 500);
        }

        function drawTrajectories() {
            const svg = document.getElementById('trajectories');
            const boardRect = document.getElementById('board').getBoundingClientRect();
            Object.keys(specials).forEach(start => {
                const end = specials[start];
                const sEl = document.getElementById('sq-' + start);
                const eEl = document.getElementById('sq-' + end);
                const sRect = sEl.getBoundingClientRect();
                const eRect = eEl.getBoundingClientRect();
                
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", sRect.left - boardRect.left + 16);
                line.setAttribute("y1", sRect.top - boardRect.top + 16);
                line.setAttribute("x2", eRect.left - boardRect.left + 16);
                line.setAttribute("y2", eRect.top - boardRect.top + 16);
                line.setAttribute("class", "trajectory " + (end > start ? "ladder" : "chute"));
                svg.appendChild(line);
            });
        }

        function createPawn(id, color) {
            const pawn = document.createElement('div');
            pawn.id = 'pawn-' + id;
            pawn.className = 'pawn';
            pawn.style.background = color;
            document.getElementById('board-wrapper').appendChild(pawn);
        }

        function movePawn(id, pos, animate = false) {
            const sq = document.getElementById('sq-' + pos);
            const pawn = document.getElementById('pawn-' + id);
            if (!sq || !pawn) return;
            const boardRect = document.getElementById('board').getBoundingClientRect();
            const sqRect = sq.getBoundingClientRect();
            
            if (animate) {
                pawn.classList.remove('hop-anim');
                void pawn.offsetWidth;
                pawn.classList.add('hop-anim');
            }
            
            pawn.style.left = (sqRect.left - boardRect.left + (id === 'p1' ? 2 : 10)) + 'px';
            pawn.style.top = (sqRect.top - boardRect.top + (id === 'p1' ? 2 : 10)) + 'px';
        }

        const sleep = ms => new Promise(res => setTimeout(res, ms));

        async function handleRoll(isProgrammatic = false) {
            if (!canMove() && !isProgrammatic) return;

            const roll = Math.floor(Math.random() * 6) + 1;
            if (myRole === 'player2') {
                NetworkManager.sendMove(roll);
                // Optimistic execution for client
                await executeRoll(roll, false);
            } else {
                if (myRole === 'host') NetworkManager.broadcastAnimation({ type: 'ROLL', roll });
                await executeRoll(roll, true);
            }
        }

        function canMove() {
            if (isSpectator || !active) return false;
            
            // Validate turn roles
            if (gameType === 'cpu' && currentPlayer === "O") return false;
            if (myRole === 'host' && currentPlayer !== "X") return false;
            if (myRole === 'player2' && currentPlayer !== "O") return false;

            return true;
        }

        async function executeRoll(roll, isLocal = true) {
            const dice = document.getElementById('dice-container');
            const rollBtn = document.getElementById('roll-btn');
            if (rollBtn) rollBtn.disabled = true; // Block during animation

            dice.classList.add('rolling');
            for(let i=0; i<10; i++) {
                dice.innerText = Math.floor(Math.random() * 6) + 1;
                await sleep(50);
            }
            dice.classList.remove('rolling');
            dice.innerText = roll;
            
            let pId = currentPlayer === "X" ? 'p1' : 'p2';
            let current = (currentPlayer === "X") ? p1Pos : p2Pos;
            
            if (current + roll <= 100) {
                for(let i=0; i<roll; i++) {
                    current++;
                    if (currentPlayer === "X") p1Pos = current; else p2Pos = current;
                    movePawn(pId, current, true);
                    await sleep(400);
                }
                
                if (specials[current]) {
                    await sleep(400);
                    current = specials[current];
                    if (currentPlayer === "X") p1Pos = current; else p2Pos = current;
                    movePawn(pId, current, true);
                }
                
                if (current === 100) {
                    active = false;
                    const names = getNames();
                    showGameOver(currentPlayer === "X" ? names.p1 : names.p2);
                    
                    const sessionPlayer = sessionStorage.getItem('webbs_active_player') || playerID;

                    if (gameType === 'online') {
                        const iWon = (myRole === 'host' && currentPlayer === 'X') || (myRole === 'player2' && currentPlayer === 'O');
                        ProfileManager.recordResult('Chutes & Ladders', sessionPlayer, (myRole === 'host' ? player2ID : 'host'), iWon ? 'win' : 'loss');
                    } else if (gameType === 'cpu') {
                        ProfileManager.recordResult('Chutes & Ladders', sessionPlayer, 'CPU', currentPlayer === 'X' ? 'win' : 'loss');
                    }
                }
            }
            
            if (active) {
                currentPlayer = (currentPlayer === "X") ? "O" : "X";
                if (isLocal) broadcast();
                updateStatus();

                if (gameType === 'cpu' && currentPlayer === 'O' && isLocal) {
                    setTimeout(() => cpuMove(), 1000);
                }
            }
        }

        function cpuMove() {
            if (!active) return;
            handleRoll(true);
        }

        function showGameOver(winner) {
            document.getElementById('winner-text').innerText = winner + " WINS!";
            document.getElementById('game-over-modal').style.display = 'flex';
            updateStatus();
        }

        function updateStatus() {
            const info = document.getElementById('turn-info');
            const resetBtn = document.getElementById('reset-btn');
            const rollBtn = document.getElementById('roll-btn');

            if (gameType === 'online') {
                resetBtn.disabled = (myRole !== 'host');
                resetBtn.style.opacity = (myRole === 'host') ? "1" : "0.5";
            } else {
                resetBtn.disabled = !active;
            }

            if (!active) {
                if (rollBtn) rollBtn.disabled = true;
                return;
            }

            const names = getNames();
            let text = currentPlayer === "X" ? `${names.p1}'s Turn` : `${names.p2}'s Turn`;
            
            if (myRole === 'host' && currentPlayer === "X") text = "YOUR TURN";
            if (myRole === 'player2' && currentPlayer === "O") text = "YOUR TURN";
            
            info.innerText = text;
            
            const isMyTurn = (myRole === 'host' && currentPlayer === 'X') || (myRole === 'player2' && currentPlayer === 'O') || (myRole === 'local' && (gameType !== 'cpu' || currentPlayer === 'X'));
            if (rollBtn) rollBtn.disabled = !isMyTurn || isSpectator;
        }

        function resetGame() {
            if (gameType === 'online' && myRole !== 'host') return;

            document.getElementById('game-over-modal').style.display = 'none';
            p1Pos = 1; p2Pos = 1; active = true;
            startingPlayer = startingPlayer === "X" ? "O" : "X";
            currentPlayer = startingPlayer;
            movePawn('p1', 1); movePawn('p2', 1);
            if (myRole === 'host') broadcast();
            updateStatus();
            if (gameType === 'cpu' && currentPlayer === "O") setTimeout(cpuMove, 1000);
        }
    </script>
</body>
</html>

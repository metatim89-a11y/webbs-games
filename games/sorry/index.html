<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry | Webbs Games</title>
    <link rel="stylesheet" href="../../style.css?v=1.1.1">
    <style>
        #board { width: 320px; height: 320px; border: 5px solid #444; position: relative; margin: 20px auto; background: #eee; }
        .square { width: 40px; height: 40px; border: 1px solid #ccc; position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
        .pawn { 
            width: 25px; height: 25px; border-radius: 50%; background: var(--primary-color); 
            border: 2px solid #000; z-index: 10; 
            transition: left 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), top 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            position: absolute;
        }
        .pawn::after {
            content: "";
            position: absolute;
            top: 20%; left: 20%;
            width: 30%; height: 30%; border-radius: 50%;
            background: rgba(255,255,255,0.4);
        }
        @keyframes hop {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.2) translateY(-15px); }
        }
        .pawn.hopping { animation: hop 0.3s ease-out; }
        #draw-btn { margin-top: 20px; padding: 10px 20px; font-size: 1.1em; cursor: pointer; }
        
        /* Card Styles */
        #deck-container { position: relative; width: 60px; height: 90px; margin: 20px auto; }
        .card-back { 
            width: 60px; height: 90px; background: #800; border: 2px solid white; border-radius: 5px; 
            position: absolute; top: 0; left: 0; box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }
        .card-flying {
            width: 60px; height: 90px; background: white; border: 2px solid #444; border-radius: 5px;
            position: fixed; z-index: 100; display: flex; align-items: center; justify-content: center;
            font-size: 2em; font-weight: bold; color: #222; box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: all 0.6s ease-out; pointer-events: none;
        }
        .card-hidden { opacity: 0; transform: scale(0.5) translateY(100px); }
    </style>
</head>
<body>
    <div id="logout-btn" style="position: fixed; top: 10px; left: 10px; z-index: 2000; cursor: pointer; background: rgba(255,0,0,0.2); border: 1px solid #800; color: #ff5555; padding: 5px 10px; border-radius: 5px; font-size: 0.8em;" onclick="logout()">Logout</div>
    <div id="winner-modal"></div> <!-- Placeholder if needed -->
    <div id="lobby-container">
        <!-- Prominent PIN Display for Host -->
        <div id="host-pin-display" style="display: none; background: rgba(255, 215, 0, 0.2); border: 2px solid gold; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
            <div style="font-size: 0.8em; text-transform: uppercase; color: gold;">Share this PIN to invite players:</div>
            <div id="table-pin-value" style="font-size: 2.5em; font-weight: bold; letter-spacing: 5px; color: white;">----</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <button onclick="location.href='../../index.html'">← Back</button>
            <div id="network-status" style="font-size: 0.9em; color: gold;"></div>
        </div>

        <h1 id="status">Sorry</h1>
        <p id="turn-info">Your Turn</p>

        <div id="multiplayer-controls" style="margin-bottom: 20px; display: none;">
            <button id="btn-join-game" onclick="requestToJoin()">Join as Player 2</button>
        </div>

        <div id="board"></div>
        
        <div id="deck-container">
            <div class="card-back" style="transform: translate(-2px, -2px);"></div>
            <div class="card-back" style="transform: translate(-1px, -1px);"></div>
            <div class="card-back" onclick="handleDraw()" style="cursor: pointer;"></div>
        </div>

        <button id="draw-btn" onclick="handleDraw()">Draw Card</button>
        <p id="game-info" style="min-height: 1.5em; font-weight: bold; color: gold;">Click the deck to move!</p>
        <button id="reset-btn" onclick="resetGame()">Reset</button>

        <!-- Table Chat -->
        <div id="table-chat-container" style="margin-top: 30px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; max-width: 400px; margin-left: auto; margin-right: auto;">
            <h3 style="margin-top: 0;">Table Chat</h3>
            <div id="table-messages" style="height: 150px; overflow-y: auto; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px; text-align: left; margin-bottom: 10px; display: flex; flex-direction: column;"></div>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="table-msg-input" placeholder="Chat with the table..." style="flex: 1; padding: 5px; border-radius: 5px; border: none; background: rgba(255,255,255,0.1); color: white;">
                <button onclick="sendTableChat()" style="padding: 5px 15px;">Send</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="../../network.js?v=1.1.1"></script>
    <script src="../../profile.js?v=1.1.1"></script>
    <script>
        let p1Pos = 0, p2Pos = 0;
        let currentPlayer = "X"; // X = Player 1, O = Player 2
        let active = true;
        let myRole = 'local';
        let isSpectator = false;
        let player2ID = null;
        const boardSize = 28;

        const urlParams = new URLSearchParams(window.location.search);
        const playerID = urlParams.get('player') || 'guest';
        const gameType = urlParams.get('type');
        const networkRole = urlParams.get('role');
        const hostPIN = urlParams.get('host');

        document.body.classList.add('theme-' + playerID);

        window.onload = () => {
            createBoard();
            if (gameType === 'online') setupMultiplayer();
            updateStatus();
        };

        function setupMultiplayer() {
            if (networkRole === 'host') {
                myRole = 'host';
                NetworkManager.init('host');
                NetworkManager.peer.on('open', (id) => {
                    document.getElementById('network-status').innerText = `Table PIN: ${id}`;
                    document.getElementById('host-pin-display').style.display = 'block';
                    document.getElementById('table-pin-value').innerText = id;
                });
                NetworkManager.onPlayerJoined = (id, conn) => {
                    if (!player2ID) {
                        player2ID = id;
                        conn.send({ type: 'JOIN_ACCEPTED' });
                        broadcast();
                    }
                };
                NetworkManager.onMoveReceived = async (move) => {
                    if (currentPlayer === "O") await executeDraw(move);
                };
            } else {
                isSpectator = true;
                document.getElementById('multiplayer-controls').style.display = 'block';
                NetworkManager.init('client', hostPIN);
                NetworkManager.onStateUpdate = (state) => {
                    p1Pos = state.p1Pos; p2Pos = state.p2Pos;
                    currentPlayer = state.currentPlayer;
                    player2ID = state.player2ID;
                    active = state.active;
                    if (player2ID === playerID) {
                        isSpectator = false;
                        myRole = 'player2';
                        document.getElementById('multiplayer-controls').style.display = 'none';
                    }
                    updatePawn('p1', p1Pos);
                    updatePawn('p2', p2Pos);
                    updateStatus();
                };
                NetworkManager.onJoinAccepted = () => {
                    isSpectator = false;
                    myRole = 'player2';
                    document.getElementById('multiplayer-controls').style.display = 'none';
                };
                document.getElementById('network-status').innerText = `Spectating PIN: ${hostPIN}`;
            }
            NetworkManager.onChatMessage = (payload) => renderTableMessage(payload);
        }

        function requestToJoin() { NetworkManager.requestJoin(); }
        function broadcast() { if (myRole === 'host') NetworkManager.broadcastState({ p1Pos, p2Pos, currentPlayer, player2ID, active }); }

        function createBoard() {
            const board = document.getElementById('board');
            for(let i=0; i<8; i++) addSquare(i*40, 0); // Top
            for(let i=1; i<8; i++) addSquare(280, i*40); // Right
            for(let i=1; i<8; i++) addSquare(280-(i*40), 280); // Bottom
            for(let i=1; i<7; i++) addSquare(0, 280-(i*40)); // Left
            
            createPawn('p1', 'var(--accent-color)');
            createPawn('p2', '#ff5555');
            updatePawn('p1', 0);
            updatePawn('p2', 0);
        }

        function addSquare(x, y) {
            const sq = document.createElement('div');
            sq.className = 'square';
            sq.style.left = x + 'px';
            sq.style.top = y + 'px';
            document.getElementById('board').appendChild(sq);
        }

        function createPawn(id, color) {
            const pawn = document.createElement('div');
            pawn.id = 'pawn-' + id;
            pawn.className = 'pawn';
            pawn.style.background = color;
            document.getElementById('board').appendChild(pawn);
        }

        function updatePawn(id, pos, animate = false) {
            const squares = document.querySelectorAll('.square');
            const pawn = document.getElementById('pawn-' + id);
            const target = squares[pos];
            if (!target || !pawn) return;

            if (animate) {
                pawn.classList.remove('hopping');
                void pawn.offsetWidth; // Force reflow
                pawn.classList.add('hopping');
            }

            const offset = (id === 'p2') ? 12 : 3;
            pawn.style.left = (target.offsetLeft + offset) + 'px';
            pawn.style.top = (target.offsetTop + offset) + 'px';
        }

        const sleep = ms => new Promise(res => setTimeout(res, ms));

        async function flyCard(num) {
            const deck = document.getElementById('deck-container');
            const rect = deck.getBoundingClientRect();
            
            const card = document.createElement('div');
            card.className = 'card-flying card-hidden';
            card.style.left = rect.left + 'px';
            card.style.top = rect.top + 'px';
            card.innerText = num;
            document.body.appendChild(card);
            
            // Force reflow
            card.offsetHeight;
            
            // Animate to center
            card.classList.remove('card-hidden');
            card.style.left = 'calc(50% - 30px)';
            card.style.top = 'calc(50% - 45px)';
            card.style.transform = 'scale(2) rotate(360deg)';
            
            await sleep(1000);
            
            // Fade out
            card.style.opacity = '0';
            card.style.transform = 'scale(3) rotate(720deg)';
            
            await sleep(400);
            card.remove();
        }

        async function handleDraw() {
            if (isSpectator || !active) return;
            if (myRole === 'host' && currentPlayer !== "X") return;
            if (myRole === 'player2' && currentPlayer !== "O") return;

            document.getElementById('draw-btn').disabled = true;
            const move = Math.floor(Math.random() * 5) + 1;
            
            if (myRole === 'player2') {
                NetworkManager.sendMove(move);
            } else {
                await executeDraw(move);
            }
        }

        async function executeDraw(move) {
            await flyCard(move);
            
            document.getElementById('game-info').innerText = (currentPlayer === 'X' ? 'Player 1' : 'Player 2') + ` moved ${move} spaces!`;
            
            const pId = (currentPlayer === 'X' ? 'p1' : 'p2');
            let currentPos = (currentPlayer === 'X' ? p1Pos : p2Pos);

            for (let i = 0; i < move; i++) {
                currentPos = (currentPos + 1) % boardSize;
                updatePawn(pId, currentPos, true);
                await sleep(350);
            }

            if (currentPlayer === 'X') {
                p1Pos = currentPos;
                if (p1Pos === 0 && move > 0) win("Player 1");
            } else {
                p2Pos = currentPos;
                if (p2Pos === 0 && move > 0) win("Player 2");
            }

            // Sorry! bump logic
            if (p1Pos === p2Pos && p1Pos !== 0) {
                if (currentPlayer === 'X') {
                    p2Pos = 0;
                    updatePawn('p2', 0, true);
                } else {
                    p1Pos = 0;
                    updatePawn('p1', 0, true);
                }
                document.getElementById('game-info').innerText += " SORRY!";
                await sleep(500);
            }

            if (active) {
                currentPlayer = (currentPlayer === 'X') ? 'O' : 'X';
                broadcast();
                updateStatus();
            }
        }

        function win(player) {
            active = false;
            document.getElementById('status').innerText = player + " Wins!";
            document.getElementById('game-info').innerText = "Game Over!";
            
            const winnerSymbol = player === "Player 1" ? "X" : "O";
            if (gameType === 'online') {
                const iWon = (myRole === 'host' && winnerSymbol === 'X') || (myRole === 'player2' && winnerSymbol === 'O');
                ProfileManager.recordResult('Sorry', playerID, (myRole === 'host' ? player2ID : 'host'), iWon ? 'win' : 'loss');
            } else if (gameType !== 'local') {
                ProfileManager.recordResult('Sorry', playerID, 'CPU', winnerSymbol === 'X' ? 'win' : 'loss');
            }
        }

        function updateStatus() {
            const statusEl = document.getElementById('turn-info');
            if (!active) return;
            let turnText = currentPlayer === "X" ? "Player 1's Turn" : "Player 2's Turn";
            if (myRole === 'host' && currentPlayer === "X") turnText += " (YOU)";
            if (myRole === 'player2' && currentPlayer === "O") turnText += " (YOU)";
            if (isSpectator) turnText += " (Spectating)";
            statusEl.innerText = turnText;
            document.getElementById('draw-btn').disabled = (myRole === 'host' && currentPlayer !== 'X') || (myRole === 'player2' && currentPlayer !== 'O') || isSpectator;
        }

        function resetGame() {
            if (isSpectator || myRole === 'player2') return;
            p1Pos = 0; p2Pos = 0; currentPlayer = "X"; active = true;
            document.getElementById('status').innerText = "Sorry";
            updatePawn('p1', 0); updatePawn('p2', 0);
            broadcast();
            updateStatus();
        }

        // --- Table Chat Logic ---
        function sendTableChat() {
            const input = document.getElementById('table-msg-input');
            const text = input.value.trim();
            if (!text) return;
            NetworkManager.sendChatMessage(text);
            input.value = "";
        }
        function renderTableMessage(payload) {
            const container = document.getElementById('table-messages');
            const div = document.createElement('div');
            div.style.css?v=1.1.1Text = "margin-bottom:5px; padding:5px; border-radius:5px; font-size:0.9em; background:rgba(255,255,255,0.05);";
            const name = payload.sender ? payload.sender.toUpperCase() : "GUEST";
            div.innerHTML = `<strong>${name}:</strong> ${payload.text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        document.getElementById('table-msg-input')?.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendTableChat(); });
    </script>
</body>
</html>

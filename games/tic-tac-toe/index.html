<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe | Webbs Games</title>
    <link rel="stylesheet" href="../../style.css?v=1.2.0">
    <style>
        .grid { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; margin: 20px auto; width: fit-content; }
        .cell { 
            width: 100px; height: 100px; background: rgba(255,255,255,0.1); border: 2px solid var(--primary-color); 
            display: flex; justify-content: center; align-items: center; font-size: 3em; cursor: pointer; 
            transition: background 0.3s;
        }
        .cell:hover { background: rgba(255,255,255,0.2); }
        .piece { animation: scaleIn 0.3s ease-out; }
        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="version-tag">v1.2.0</div>

    <div class="rules-block" id="rules-block">
        <div class="rules-toggle" onclick="toggleRules()">
            <i class="info-icon">i</i>
            <span>Rules</span>
            <span class="rules-subtext">Need help?</span>
        </div>
        <div class="rules-content-mini" id="rules-content">
            <strong>Objective:</strong> Be the first to get 3 in a row.<br><br>
            <strong>Rules:</strong>
            <ul>
                <li>Take turns placing X or O on the grid.</li>
                <li>First to align 3 symbols horizontally, vertically, or diagonally wins.</li>
            </ul>
        </div>
    </div>

    <div id="game-over-modal" class="game-over-modal">
        <div class="modal-content">
            <div class="winner-announcement" id="winner-text">PLAYER 1 WINS!</div>
            <button class="modal-btn" onclick="resetGame()">Play Again</button>
            <button class="modal-btn" onclick="location.href='../../index.html'">Main Menu</button>
        </div>
    </div>

    <div id="lobby-container">
        <div id="host-pin-display" style="display: none; background: rgba(255, 215, 0, 0.2); border: 2px solid gold; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
            <div style="font-size: 0.8em; text-transform: uppercase; color: gold;">Share this PIN:</div>
            <div id="table-pin-value" style="font-size: 2.5em; font-weight: bold; letter-spacing: 5px; color: white;">----</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <button onclick="location.href='../../index.html'">← Back</button>
            <div id="network-status" style="font-size: 0.9em; color: gold;"></div>
        </div>

        <h1 id="game-status">Tic-Tac-Toe</h1>
        <p id="turn-info" style="font-weight: bold; color: var(--accent-color);">Your Turn</p>

        <div id="multiplayer-controls" style="margin-bottom: 20px; display: none;">
            <button id="btn-join-game" onclick="NetworkManager.requestJoin()">Join as Player 2</button>
        </div>

        <div class="grid" id="board">
            <div class="cell" onclick="handleCellClick(0)"></div>
            <div class="cell" onclick="handleCellClick(1)"></div>
            <div class="cell" onclick="handleCellClick(2)"></div>
            <div class="cell" onclick="handleCellClick(3)"></div>
            <div class="cell" onclick="handleCellClick(4)"></div>
            <div class="cell" onclick="handleCellClick(5)"></div>
            <div class="cell" onclick="handleCellClick(6)"></div>
            <div class="cell" onclick="handleCellClick(7)"></div>
            <div class="cell" onclick="handleCellClick(8)"></div>
        </div>
        
        <button id="reset-btn" class="modal-btn" style="background: rgba(255,255,255,0.1);" onclick="resetGame()">Reset</button>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="../../network.js?v=1.2.0"></script>
    <script src="../../profile.js?v=1.2.0"></script>
    <script>
        let board = ["","","","","","","","",""], currentPlayer = "X", active = true;
        let myRole = 'local';
        let isSpectator = false;
        let player2ID = null;
        let startingPlayer = "X";

        const urlParams = new URLSearchParams(window.location.search);
        const playerID = urlParams.get('player') || 'guest';
        const gameType = urlParams.get('type');
        const networkRole = urlParams.get('role');
        const hostPIN = urlParams.get('host');

        document.body.classList.add('theme-' + playerID);

        window.onload = () => {
            if (gameType === 'online') setupMultiplayer();
            render();
        };

        function toggleRules() {
            document.getElementById('rules-block').classList.toggle('expanded');
        }

        function setupMultiplayer() {
            if (networkRole === 'host') {
                myRole = 'host';
                NetworkManager.onPlayerJoined = (id, conn) => {
                    if (!player2ID) {
                        player2ID = id;
                        conn.send({ type: 'JOIN_ACCEPTED' });
                        broadcast();
                    }
                };
                NetworkManager.onMoveReceived = (idx) => {
                    if (currentPlayer === "O") executeMove(idx);
                };
                NetworkManager.init('host');
                NetworkManager.peer.on('open', (id) => {
                    document.getElementById('network-status').innerText = `PIN: ${id}`;
                    document.getElementById('host-pin-display').style.display = 'block';
                    document.getElementById('table-pin-value').innerText = id;
                });
            } else {
                isSpectator = true;
                NetworkManager.onStateUpdate = (state) => {
                    board = state.board;
                    currentPlayer = state.currentPlayer;
                    active = state.active;
                    player2ID = state.player2ID;
                    if (player2ID === playerID) {
                        isSpectator = false;
                        myRole = 'player2';
                        document.getElementById('multiplayer-controls').style.display = 'none';
                    }
                    if (!active) checkWin(); // To trigger modal for spectator
                    render();
                };
                NetworkManager.onJoinAccepted = () => {
                    isSpectator = false;
                    myRole = 'player2';
                    document.getElementById('multiplayer-controls').style.display = 'none';
                };
                NetworkManager.init('client', hostPIN);
            }
        }

        function broadcast() {
            if (myRole === 'host') NetworkManager.broadcastState({ board, currentPlayer, active, player2ID });
        }

        function handleCellClick(idx) {
            if (isSpectator || !active) return;
            if (myRole === 'host' && currentPlayer !== "X") return;
            if (myRole === 'player2' && currentPlayer !== "O") return;

            if (board[idx] === "") {
                if (myRole === 'player2') NetworkManager.sendMove(idx);
                else executeMove(idx);
            }
        }

        function executeMove(idx) {
            board[idx] = currentPlayer;
            if (!checkWin()) {
                currentPlayer = currentPlayer === "X" ? "O" : "X";
            }
            broadcast();
            render();
        }

        function render() {
            const cells = document.querySelectorAll('.cell');
            board.forEach((val, i) => {
                cells[i].innerText = val;
                cells[i].classList.toggle('piece', val !== "");
            });
            updateStatus();
        }

        function updateStatus() {
            const info = document.getElementById('turn-info');
            if (!active) return;
            let text = currentPlayer === "X" ? "Player 1's Turn" : "Player 2's Turn";
            if (myRole === 'host' && currentPlayer === "X") text += " (YOU)";
            if (myRole === 'player2' && currentPlayer === "O") text += " (YOU)";
            info.innerText = text;
        }

        function checkWin() {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let c of wins) {
                if (board[c[0]] && board[c[0]] === board[c[1]] && board[c[0]] === board[c[2]]) {
                    const winnerSymbol = board[c[0]];
                    const winnerName = winnerSymbol === "X" ? "PLAYER 1" : "PLAYER 2";
                    active = false;
                    showGameOver(winnerName);
                    
                    if (gameType === 'online') {
                        const iWon = (myRole === 'host' && winnerSymbol === 'X') || (myRole === 'player2' && winnerSymbol === 'O');
                        ProfileManager.recordResult('Tic-Tac-Toe', playerID, (myRole === 'host' ? player2ID : 'host'), iWon ? 'win' : 'loss');
                    } else if (gameType === 'cpu') {
                        ProfileManager.recordResult('Tic-Tac-Toe', playerID, 'CPU', winnerSymbol === 'X' ? 'win' : 'loss');
                    }
                    return true;
                }
            }
            if (!board.includes("")) { 
                active = false;
                showGameOver("DRAW");
                return true; 
            }
            return false;
        }

        function showGameOver(winner) {
            document.getElementById('winner-text').innerText = winner === "DRAW" ? "IT'S A DRAW!" : winner + " WINS!";
            document.getElementById('game-over-modal').style.display = 'flex';
        }

        function resetGame() {
            document.getElementById('game-over-modal').style.display = 'none';
            board = ["","","","","","","","",""];
            active = true;
            startingPlayer = startingPlayer === "X" ? "O" : "X";
            currentPlayer = startingPlayer;
            broadcast();
            render();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mancala | Webbs Games</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        #mancala-board {
            display: flex; align-items: center; justify-content: center;
            background: #5d4037; padding: 20px; border-radius: 50px;
            margin: 20px auto; width: fit-content; gap: 10px;
        }
        .store {
            width: 60px; height: 180px; background: rgba(0,0,0,0.3);
            border-radius: 30px; display: flex; align-items: center;
            justify-content: center; font-size: 2em;
        }
        .pits-container { display: flex; flex-direction: column; gap: 20px; }
        .row { display: flex; gap: 10px; }
        .pit {
            width: 50px; height: 50px; background: rgba(0,0,0,0.3);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; cursor: pointer; font-weight: bold;
        }
        .pit.disabled { cursor: default; }
        
        /* Stone Animation */
        .stone-count {
            transition: transform 0.2s ease-out, color 0.2s;
            display: inline-block;
        }
        .pit.active-sow {
            background: rgba(255, 215, 0, 0.3) !important;
            transform: scale(1.1);
            transition: all 0.2s;
        }
        .store.active-sow {
            background: rgba(255, 215, 0, 0.3) !important;
            transform: scale(1.05);
            transition: all 0.2s;
        }
        @keyframes pulseStone {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); color: gold; }
            100% { transform: scale(1); }
        }
        .anim-pulse { animation: pulseStone 0.3s ease-out; }
    </style>
</head>
<body>
    <div id="lobby-container">
        <!-- Prominent PIN Display for Host -->
        <div id="host-pin-display" style="display: none; background: rgba(255, 215, 0, 0.2); border: 2px solid gold; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
            <div style="font-size: 0.8em; text-transform: uppercase; color: gold;">Share this PIN to invite players:</div>
            <div id="table-pin-value" style="font-size: 2.5em; font-weight: bold; letter-spacing: 5px; color: white;">----</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <button onclick="location.href='../../index.html'">← Back</button>
            <div id="network-status" style="font-size: 0.9em; color: gold;"></div>
        </div>

        <h1 id="status">Mancala</h1>
        <p id="turn-info">Your Turn</p>

        <div id="multiplayer-controls" style="margin-bottom: 20px; display: none;">
            <button id="btn-join-game" onclick="requestToJoin()">Join as Player 2</button>
        </div>

        <div id="mancala-board">
            <div id="store-1" class="store">0</div> <div class="pits-container">
                <div class="row" id="cpu-pits">
                    <div class="pit" id="pit-12" onclick="handlePitClick(12)">4</div>
                    <div class="pit" id="pit-11" onclick="handlePitClick(11)">4</div>
                    <div class="pit" id="pit-10" onclick="handlePitClick(10)">4</div>
                    <div class="pit" id="pit-9" onclick="handlePitClick(9)">4</div>
                    <div class="pit" id="pit-8" onclick="handlePitClick(8)">4</div>
                    <div class="pit" id="pit-7" onclick="handlePitClick(7)">4</div>
                </div>
                <div class="row" id="player-pits">
                    <div class="pit" id="pit-0" onclick="handlePitClick(0)">4</div>
                    <div class="pit" id="pit-1" onclick="handlePitClick(1)">4</div>
                    <div class="pit" id="pit-2" onclick="handlePitClick(2)">4</div>
                    <div class="pit" id="pit-3" onclick="handlePitClick(3)">4</div>
                    <div class="pit" id="pit-4" onclick="handlePitClick(4)">4</div>
                    <div class="pit" id="pit-5" onclick="handlePitClick(5)">4</div>
                </div>
            </div>
            <div id="store-0" class="store">0</div> </div>

        <button id="reset-btn" onclick="resetGame()">Reset</button>

        <!-- Table Chat -->
        <div id="table-chat-container" style="margin-top: 30px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; max-width: 400px; margin-left: auto; margin-right: auto;">
            <h3 style="margin-top: 0;">Table Chat</h3>
            <div id="table-messages" style="height: 150px; overflow-y: auto; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px; text-align: left; margin-bottom: 10px; display: flex; flex-direction: column;"></div>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="table-msg-input" placeholder="Chat with the table..." style="flex: 1; padding: 5px; border-radius: 5px; border: none; background: rgba(255,255,255,0.1); color: white;">
                <button onclick="sendTableChat()" style="padding: 5px 15px;">Send</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="../../network.js"></script>
    <script src="../../profile.js"></script>
    <script>
        let board = [4, 4, 4, 4, 4, 4, 0, 4, 4, 4, 4, 4, 4, 0];
        let currentPlayer = 0; // 0 = Host (Bottom), 1 = Player 2 (Top)
        let active = true;
        let myRole = 'local';
        let isSpectator = false;
        let player2ID = null;

        const urlParams = new URLSearchParams(window.location.search);
        const playerID = urlParams.get('player') || 'guest';
        const gameType = urlParams.get('type');
        const networkRole = urlParams.get('role');
        const hostPIN = urlParams.get('host');

        document.body.classList.add('theme-' + playerID);

        window.onload = () => {
            if (gameType === 'online') setupMultiplayer();
            render();
        };

        function setupMultiplayer() {
            if (networkRole === 'host') {
                myRole = 'host';
                NetworkManager.init('host');
                NetworkManager.peer.on('open', (id) => {
                    document.getElementById('network-status').innerText = `Table PIN: ${id}`;
                    document.getElementById('host-pin-display').style.display = 'block';
                    document.getElementById('table-pin-value').innerText = id;
                });
                NetworkManager.onPlayerJoined = (id, conn) => {
                    if (!player2ID) {
                        player2ID = id;
                        conn.send({ type: 'JOIN_ACCEPTED' });
                        broadcast();
                    }
                };
                NetworkManager.onMoveReceived = async (pit) => {
                    if (currentPlayer === 1) await sow(pit);
                };
            } else {
                isSpectator = true;
                document.getElementById('multiplayer-controls').style.display = 'block';
                NetworkManager.init('client', hostPIN);
                NetworkManager.onStateUpdate = (state) => {
                    board = state.board;
                    currentPlayer = state.currentPlayer;
                    player2ID = state.player2ID;
                    active = state.active;
                    if (player2ID === playerID) {
                        isSpectator = false;
                        myRole = 'player2';
                        document.getElementById('multiplayer-controls').style.display = 'none';
                    }
                    render();
                };
                NetworkManager.onJoinAccepted = () => {
                    isSpectator = false;
                    myRole = 'player2';
                    document.getElementById('multiplayer-controls').style.display = 'none';
                };
                document.getElementById('network-status').innerText = `Spectating PIN: ${hostPIN}`;
            }
            NetworkManager.onChatMessage = (payload) => renderTableMessage(payload);
        }

        function requestToJoin() { NetworkManager.requestJoin(); }
        function broadcast() { if (myRole === 'host') NetworkManager.broadcastState({ board, currentPlayer, player2ID, active }); }

        function render() {
            for (let i = 0; i < 14; i++) {
                const el = document.getElementById(i === 6 ? 'store-0' : i === 13 ? 'store-1' : `pit-${i}`);
                if (el) {
                    el.innerHTML = `<span class="stone-count">${board[i]}</span>`;
                    el.classList.toggle('disabled', isSpectator || (currentPlayer === 0 && i > 5) || (currentPlayer === 1 && i < 7) || board[i] === 0);
                }
            }
            updateStatus();
        }

        function updateStatus() {
            const statusEl = document.getElementById('turn-info');
            if (!active) return;
            let turnText = currentPlayer === 0 ? "Player 1's Turn" : "Player 2's Turn";
            if (myRole === 'host' && currentPlayer === 0) turnText += " (YOU)";
            if (myRole === 'player2' && currentPlayer === 1) turnText += " (YOU)";
            if (isSpectator) turnText += " (Spectating)";
            statusEl.innerText = turnText;
        }

        const sleep = ms => new Promise(res => setTimeout(res, ms));

        async function handlePitClick(pit) {
            if (isSpectator || !active || board[pit] === 0) return;
            if (myRole === 'host' && (currentPlayer !== 0 || pit > 5)) return;
            if (myRole === 'player2' && (currentPlayer !== 1 || pit < 7)) return;

            // Block input during animation
            const pits = document.querySelectorAll('.pit');
            pits.forEach(p => p.style.pointerEvents = 'none');

            if (myRole === 'player2') {
                NetworkManager.sendMove(pit);
            } else {
                await sow(pit);
            }
            
            pits.forEach(p => p.style.pointerEvents = 'auto');
        }

        async function sow(pit) {
            let stones = board[pit];
            board[pit] = 0;
            render(); // Clear the starting pit immediately
            
            let current = pit;
            while (stones > 0) {
                current = (current + 1) % 14;
                // Skip opponent's store
                if ((currentPlayer === 0 && current === 13) || (currentPlayer === 1 && current === 6)) continue;
                
                // Visual feedback for current pit
                const el = document.getElementById(current === 6 ? 'store-0' : current === 13 ? 'store-1' : `pit-${current}`);
                if (el) {
                    el.classList.add('active-sow');
                    const span = el.querySelector('.stone-count');
                    if (span) span.classList.add('anim-pulse');
                }

                board[current]++;
                stones--;
                render(); // Update count visually
                
                await sleep(350); // Professional pace

                if (el) {
                    el.classList.remove('active-sow');
                    const span = el.querySelector('.stone-count');
                    if (span) span.classList.remove('anim-pulse');
                }
            }
            
            // Capture logic
            if (board[current] === 1) { // If it was empty before the last stone
                const isPlayerSide = (currentPlayer === 0 && current >= 0 && current <= 5);
                const isOpponentSide = (currentPlayer === 1 && current >= 7 && current <= 12);
                
                if (isPlayerSide || isOpponentSide) {
                    const opposite = 12 - current;
                    if (board[opposite] > 0) {
                        // Pulse the captured pits
                        const currentEl = document.getElementById(`pit-${current}`);
                        const oppositeEl = document.getElementById(`pit-${opposite}`);
                        const storeEl = document.getElementById(currentPlayer === 0 ? 'store-0' : 'store-1');
                        
                        if (currentEl) currentEl.classList.add('active-sow');
                        if (oppositeEl) oppositeEl.classList.add('active-sow');
                        
                        await sleep(600); // Pause to show the capture

                        const captured = board[opposite] + 1;
                        board[opposite] = 0;
                        board[current] = 0;
                        board[currentPlayer === 0 ? 6 : 13] += captured;

                        if (currentEl) currentEl.classList.remove('active-sow');
                        if (oppositeEl) oppositeEl.classList.remove('active-sow');
                        if (storeEl) {
                            storeEl.classList.add('anim-pulse');
                            setTimeout(() => storeEl.classList.remove('anim-pulse'), 500);
                        }
                        
                        render();
                        await sleep(300);
                    }
                }
            }
            
            // Extra turn check
            if ((currentPlayer === 0 && current !== 6) || (currentPlayer === 1 && current !== 13)) {
                currentPlayer = currentPlayer === 0 ? 1 : 0;
            }
            
            checkEnd();
            broadcast();
            render();
            
            if (gameType === 'cpu' && active && currentPlayer === 1) {
                document.getElementById('turn-info').innerText = "CPU thinking...";
                setTimeout(cpuMove, 1000);
            }
        }

        async function cpuMove() {
            let validPits = [7, 8, 9, 10, 11, 12].filter(p => board[p] > 0);
            if (validPits.length > 0) {
                await sow(validPits[Math.floor(Math.random() * validPits.length)]);
            }
        }

        function checkEnd() {
            const pSide = board.slice(0, 6).every(s => s === 0);
            const cSide = board.slice(7, 13).every(s => s === 0);
            if (pSide || cSide) {
                active = false;
                const pTotal = board[6];
                const cTotal = board[13];
                const winner = pTotal > cTotal ? 0 : 1;
                document.getElementById('status').innerText = `Game Over: ${pTotal}-${cTotal}`;
                document.getElementById('turn-info').innerText = pTotal === cTotal ? "Draw!" : (winner === 0 ? "Player 1 Wins!" : "Player 2 Wins!");
                
                if (gameType === 'online') {
                    const iWon = (myRole === 'host' && winner === 0) || (myRole === 'player2' && winner === 1);
                    ProfileManager.recordResult('Mancala', playerID, (myRole === 'host' ? player2ID : 'host'), pTotal === cTotal ? 'draw' : (iWon ? 'win' : 'loss'));
                } else if (gameType === 'cpu') {
                    ProfileManager.recordResult('Mancala', playerID, 'CPU', pTotal === cTotal ? 'draw' : (winner === 0 ? 'win' : 'loss'));
                }
            }
        }

        function resetGame() {
            if (isSpectator || myRole === 'player2') return;
            board = [4, 4, 4, 4, 4, 4, 0, 4, 4, 4, 4, 4, 4, 0];
            active = true; currentPlayer = 0;
            document.getElementById('status').innerText = "Mancala";
            broadcast();
            render();
        }

        // --- Table Chat Logic ---
        function sendTableChat() {
            const input = document.getElementById('table-msg-input');
            const text = input.value.trim();
            if (!text) return;
            NetworkManager.sendChatMessage(text);
            input.value = "";
        }
        function renderTableMessage(payload) {
            const container = document.getElementById('table-messages');
            const div = document.createElement('div');
            div.style.cssText = "margin-bottom:5px; padding:5px; border-radius:5px; font-size:0.9em; background:rgba(255,255,255,0.05);";
            const name = payload.sender ? payload.sender.toUpperCase() : "GUEST";
            div.innerHTML = `<strong>${name}:</strong> ${payload.text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        document.getElementById('table-msg-input')?.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendTableChat(); });
    </script>
</body>
</html>

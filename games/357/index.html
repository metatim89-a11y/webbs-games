<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>357 | Webbs Games</title>
    <link rel="stylesheet" href="../../style.css?v=1.3.9">
</head>
<body>
    <div id="version-tag">v1.3.9</div>
    
    <div class="rules-block" id="rules-block">
        <div class="rules-toggle" onclick="toggleRules()">
            <i class="info-icon">i</i>
            <span>Rules</span>
            <span class="rules-subtext">Need help?</span>
        </div>
        <div class="rules-content-mini" id="rules-content">
            <strong>Objective:</strong> Take the last item to win!<br><br>
            <strong>Rules:</strong>
            <ul>
                <li>Take at least one item per turn.</li>
                <li>Only take from ONE column per turn.</li>
                <li>You can take any amount from that column.</li>
            </ul>
        </div>
    </div>

    <div id="game-over-modal" class="game-over-modal">
        <div class="modal-content">
            <div class="winner-announcement" id="winner-text">PLAYER 1 WINS!</div>
            <button class="modal-btn" onclick="resetGame()">Play Again</button>
            <button class="modal-btn" onclick="location.href='../../index.html'">Main Menu</button>
        </div>
    </div>

    <div id="lobby-container">
        <div id="host-pin-display" style="display: none; background: rgba(255, 215, 0, 0.2); border: 2px solid gold; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
            <div style="font-size: 0.8em; text-transform: uppercase; color: gold;">Share this PIN:</div>
            <div id="table-pin-value" style="font-size: 2.5em; font-weight: bold; letter-spacing: 5px; color: white;">----</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <button onclick="location.href='../../index.html'">← Back</button>
            <div id="network-status" style="font-size: 0.9em; color: gold;"></div>
        </div>

        <h1 id="status-title">357 (Nim)</h1>
        <p id="turn-info" style="font-weight: bold; color: var(--accent-color);">Your Turn</p>

        <div id="multiplayer-controls" style="margin-bottom: 20px; display: none;">
            <button id="btn-join-game" onclick="NetworkManager.requestJoin()">Join as Player 2</button>
        </div>

        <div class="nim-board" id="board">
            <div id="row-0" class="nim-row"></div>
            <div id="row-1" class="nim-row"></div>
            <div id="row-2" class="nim-row"></div>
        </div>

        <div id="controls" style="margin-top: 30px;">
            <button id="end-turn-btn" class="modal-btn" onclick="endTurn()" disabled>Take Selected</button>
            <button id="reset-btn" class="modal-btn" style="background: rgba(255,255,255,0.1);" onclick="resetGame()">Reset</button>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="../../network.js?v=1.3.9"></script>
    <script src="../../profile.js?v=1.3.9"></script>
    <script src="../../audio.js?v=1.3.9"></script>
    <script>
        let piles = [3, 5, 7];
        let selectedRow = null, selectedCount = 0;
        let myRole = 'local'; 
        let isSpectator = false;
        let currentPlayer = "X"; 
        let player2ID = null;
        let active = true;
        let startingPlayer = "X";

        const urlParams = new URLSearchParams(window.location.search);
        const playerID = urlParams.get('player') || 'guest';
        const gameType = urlParams.get('type');
        const networkRole = urlParams.get('role');
        const hostPIN = urlParams.get('host');

        document.body.classList.add('theme-' + playerID);

        function getNames() {
            const p1 = ProfileManager.resolveName(playerID);
            let p2 = "Player 2";
            if (gameType === 'cpu') p2 = "Computer";
            else if (gameType === 'online') p2 = ProfileManager.resolveName(player2ID || 'guest');
            return { p1, p2 };
        }

        window.onload = () => {
            if (gameType === 'online') setupMultiplayer();
            render();
        };

        function toggleRules() {
            document.getElementById('rules-block').classList.toggle('expanded');
        }

        function setupMultiplayer() {
            if (networkRole === 'host') {
                myRole = 'host';
                NetworkManager.onPlayerJoined = (id, conn) => {
                    if (!player2ID) {
                        player2ID = id;
                        conn.send({ type: 'JOIN_ACCEPTED' });
                        broadcast();
                    }
                };
                NetworkManager.onMoveReceived = (move) => {
                    if (currentPlayer === "O") executeMove(move.row, move.count, true);
                };
                NetworkManager.init('host');
                NetworkManager.peer.on('open', (id) => {
                    document.getElementById('network-status').innerText = `PIN: ${id}`;
                    document.getElementById('host-pin-display').style.display = 'block';
                    document.getElementById('table-pin-value').innerText = id;
                });
            } else {
                isSpectator = true;
                NetworkManager.onStateUpdate = (state) => {
                    piles = state.piles;
                    currentPlayer = state.currentPlayer;
                    player2ID = state.player2ID;
                    active = state.active;
                    if (player2ID === playerID) {
                        isSpectator = false;
                        myRole = 'player2';
                        document.getElementById('multiplayer-controls').style.display = 'none';
                    }
                    if (!active) {
                        const winner = state.winner || (currentPlayer === "X" ? "PLAYER 1" : "PLAYER 2");
                        showGameOver(winner);
                    }
                    render();
                };
                NetworkManager.onJoinAccepted = () => {
                    isSpectator = false;
                    myRole = 'player2';
                    document.getElementById('multiplayer-controls').style.display = 'none';
                };
                NetworkManager.init('client', hostPIN);
            }
        }

        function broadcast() {
            if (myRole === 'host') {
                const names = getNames();
                const allEmpty = piles.every(p => p === 0);
                const winnerName = allEmpty ? (currentPlayer === "X" ? names.p1 : names.p2) : null;
                NetworkManager.broadcastState({ piles, currentPlayer, player2ID, active, winner: winnerName });
            }
        }

        function render() {
            [0, 1, 2].forEach(i => {
                const rowEl = document.getElementById(`row-${i}`);
                rowEl.innerHTML = '';
                // The max items in any row is 7
                for(let j=0; j<7; j++) {
                    const slot = document.createElement('div');
                    slot.className = 'nim-piece-slot';
                    
                    if (j < piles[i]) {
                        const piece = document.createElement('div');
                        const isSelected = selectedRow === i && j >= piles[i] - selectedCount;
                        piece.className = 'nim-piece' + (isSelected ? ' selected' : '');
                        piece.onclick = () => selectPiece(i, j);
                        slot.appendChild(piece);
                    }
                    rowEl.appendChild(slot);
                }
            });
            updateStatus();
        }

        function updateStatus() {
            const info = document.getElementById('turn-info');
            const resetBtn = document.getElementById('reset-btn');
            const endTurnBtn = document.getElementById('end-turn-btn');

            if (gameType === 'online') {
                resetBtn.disabled = (myRole !== 'host');
                resetBtn.style.opacity = (myRole === 'host') ? "1" : "0.5";
            } else {
                resetBtn.disabled = !active;
            }

            if (!active) return;
            
            const names = getNames();
            let text = currentPlayer === "X" ? `${names.p1}'s Turn` : `${names.p2}'s Turn`;
            
            const isMyTurn = (myRole === 'host' && currentPlayer === 'X') || (myRole === 'player2' && currentPlayer === 'O') || (myRole === 'local' && (gameType !== 'cpu' || currentPlayer === 'X'));
            if (isMyTurn) text = "YOUR TURN";
            else if (gameType === 'online') text = `WAITING FOR ${currentPlayer === 'X' ? names.p1.toUpperCase() : names.p2.toUpperCase()}...`;
            
            info.innerText = text;

            // Also disable end turn button if not your turn
            endTurnBtn.disabled = selectedCount === 0 || !active || isSpectator || !isMyTurn;
        }

        function selectPiece(row, index) {
            if (!canMove()) return;

            const count = piles[row] - index;
            if (selectedRow === row && selectedCount === count) {
                // Deselect if clicking the same count
                selectedRow = null;
                selectedCount = 0;
            } else {
                selectedRow = row;
                selectedCount = count;
            }
            render();
        }

        function canMove() {
            if (isSpectator || !active) return false;
            
            // Validate turn roles
            if (gameType === 'cpu' && currentPlayer === "O") return false;
            if (myRole === 'host' && currentPlayer !== "X") return false;
            if (myRole === 'player2' && currentPlayer !== "O") return false;

            return true;
        }

        function endTurn() {
            if (!canMove() || selectedCount === 0) return;

            if (myRole === 'player2') {
                NetworkManager.sendMove({ row: selectedRow, count: selectedCount });
                executeMove(selectedRow, selectedCount, false);
            } else {
                executeMove(selectedRow, selectedCount, true);
            }
        }

        function executeMove(row, count, isLocal = true) {
            piles[row] -= count;
            selectedRow = null; selectedCount = 0;
            render(); // Update visuals immediately

            if (!checkGameOver()) {
                currentPlayer = currentPlayer === "X" ? "O" : "X";
                if (gameType === 'cpu' && currentPlayer === "O" && isLocal) {
                    setTimeout(cpuMove, 800);
                }
            }
            if (isLocal) broadcast();
            updateStatus();
        }

        function cpuMove() {
            if (!active) return;
            let rowsWithItems = piles.map((p, i) => p > 0 ? i : -1).filter(i => i !== -1);
            if (rowsWithItems.length === 0) return;
            let row = rowsWithItems[Math.floor(Math.random() * rowsWithItems.length)];
            let count = Math.floor(Math.random() * piles[row]) + 1;
            executeMove(row, count, true);
        }

        function checkGameOver() {
            if (piles.every(p => p === 0)) {
                active = false;
                const names = getNames();
                const winner = currentPlayer === "X" ? names.p1 : names.p2;
                showGameOver(winner);
                
                const sessionPlayer = sessionStorage.getItem('webbs_active_player') || playerID;

                if (gameType === 'online') {
                    const iWon = (myRole === 'host' && currentPlayer === 'X') || (myRole === 'player2' && currentPlayer === 'O');
                    ProfileManager.recordResult('357', sessionPlayer, (myRole === 'host' ? player2ID : 'host'), iWon ? 'win' : 'loss');
                } else if (gameType === 'cpu') {
                    ProfileManager.recordResult('357', sessionPlayer, 'CPU', currentPlayer === 'X' ? 'win' : 'loss');
                }
                return true;
            }
            return false;
        }

        function showGameOver(winner) {
            document.getElementById('winner-text').innerText = winner + " WINS!";
            document.getElementById('game-over-modal').style.display = 'flex';
            updateStatus();
        }

        function resetGame() {
            if (gameType === 'online' && myRole !== 'host') return;

            document.getElementById('game-over-modal').style.display = 'none';
            piles = [3, 5, 7];
            selectedRow = null; selectedCount = 0; active = true;
            // Rotate starting player
            startingPlayer = startingPlayer === "X" ? "O" : "X";
            currentPlayer = startingPlayer;
            if (myRole === 'host') broadcast();
            render();
            if (gameType === 'cpu' && currentPlayer === "O") setTimeout(cpuMove, 800);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Select Game | Wubs Games</title>
    <link rel="stylesheet" href="style.css?v=1.4.16">
</head>
<body class="theme-guest">
    <div id="version-tag">v1.4.16</div>

    <div id="lobby-container">
        <header class="app-bar">
            <button class="back-btn bar-btn" onclick="location.href='index.html'" aria-label="Back to the lobby">← Lobby</button>
            <div class="bar-tools"></div>
        </header>
        <h1 class="page-title">Pick a game</h1>
        <p id="mode-hint" class="page-hint">Then choose who's playing: the computer, someone here, or someone online.</p>

        <div class="game-grid" id="game-list"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <script src="cloud.js?v=1.4.16"></script>
    <script src="profile.js?v=1.4.16"></script>
    <script src="audio.js?v=1.4.16"></script>
    <script src="seat-picker.js?v=1.4.16"></script>
    <script src="help.js?v=1.4.16"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const player = params.get('player') || sessionStorage.getItem('webbs_active_player') || 'guest';
        const mode = params.get('mode'); // 'online' from older "Host Online Table" links: start with Online player picked
        document.body.classList.add('theme-' + player);

        // One button per game, from the one game list every page shares (seat-picker.js)
        const list = document.getElementById('game-list');
        if (mode === 'online') document.getElementById('mode-hint').textContent = "Pick the game to host. Online player is picked for you, and you get a table PIN to share.";
        SeatPicker.GAMES.forEach(g => {
            const guide = (window.WubsHelp && WubsHelp.TOPICS[g.id]) || {};
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'game-card';
            b.dataset.game = g.id;
            b.innerHTML = '<span class="game-card-icon" aria-hidden="true"></span><span class="game-card-text"><span class="game-card-name"></span><span class="game-card-goal"></span></span><span class="game-card-go" aria-hidden="true">›</span>';
            b.querySelector('.game-card-icon').textContent = guide.icon || '🎲';
            b.querySelector('.game-card-name').textContent = g.title;
            b.querySelector('.game-card-goal').textContent = guide.goal || '';
            b.onclick = () => SeatPicker.open(g.id, { player, preset: mode === 'online' ? { seat2: 'online', listed: true } : undefined });
            list.appendChild(b);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Game | Webbs Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lobby-container">
        <button onclick="location.href='index.html'">← Back to Lobby</button>
        <h1 id="welcome-msg">Select a Game</h1>

        <div class="game-grid">
            <div class="game-card" onclick="launchGame('tic-tac-toe')">
                <h3>Tic-Tac-Toe</h3>
                <p>Strategy</p>
            </div>
            <div class="game-card" onclick="launchGame('357')">
                <h3>357 (Nim)</h3>
                <p>Math</p>
            </div>
            <div class="game-card" onclick="launchGame('mancala')">
                <h3>Mancala</h3>
                <p>Classic Board</p>
            </div>
             <div class="game-card" onclick="launchGame('black-hole')">
                <h3>Black Hole</h3>
                <p>Space Strategy</p>
            </div>
            <div class="game-card" onclick="launchGame('uno-no-mercy')">
                <h3>Uno No Mercy</h3>
                <p>Card Game</p>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const playerID = urlParams.get('player') || 'guest';
        document.body.classList.add('theme-' + playerID);
        document.getElementById('welcome-msg').innerText = `What's the play, ${playerID.charAt(0).toUpperCase() + playerID.slice(1)}?`;

        function launchGame(gamePath) {
            // This is where we create the "Table" by adding the player info to the URL
            window.location.href = `games/${gamePath}/index.html?player=${playerID}`;
        }
    </script>
</body>
</html>

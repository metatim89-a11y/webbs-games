<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Select Game | Wubs Games</title>
    <link rel="stylesheet" href="style.css?v=1.3.7">
</head>
<body class="theme-guest">
    <div id="version-tag">v1.3.7</div>
    
    <div id="lobby-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <button onclick="location.href='index.html'" style="background:none; border:none; color:gold; font-size: 1.2em; cursor: pointer;">← Lobby</button>
            <h1 id="mode-title" style="margin: 0; font-size: 1.5em;">Pick a Game</h1>
        </div>

        <div class="game-grid" id="game-list">
            <button onclick="selectGame('tic-tac-toe')">Tic-Tac-Toe</button>
            <button onclick="selectGame('357')">357 (Nim)</button>
            <button onclick="selectGame('mancala')">Mancala</button>
            <button onclick="selectGame('black-hole')">Black Hole</button>
            <button onclick="selectGame('chutes-and-ladders')">Chutes & Ladders</button>
            <button onclick="selectGame('sorry')">Sorry!</button>
            <button onclick="selectGame('uno-no-mercy')">Uno No Mercy</button>
        </div>

        <!-- Play Style Modal (Replacement for sub-mode) -->
        <div id="sub-mode" class="game-over-modal">
            <div class="modal-content">
                <h3>Play Style</h3>
                <button id="btn-cpu" class="modal-btn" style="width: 100%;">vs. Computer</button>
                <button id="btn-local" class="modal-btn" style="width: 100%;">Local Multiplayer</button>
                <button onclick="document.getElementById('sub-mode').style.display='none'" class="modal-btn" style="background:none; width: 100%;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const player = params.get('player') || 'guest';
        const mode = params.get('mode'); 
        document.body.classList.add('theme-' + player);

        function selectGame(game) {
            if (mode === 'online') {
                window.location.href = `games/${game}/index.html?player=${player}&type=online&role=host`;
            } else {
                document.getElementById('sub-mode').style.display = 'flex';
                document.getElementById('btn-cpu').onclick = () => {
                    window.location.href = `games/${game}/index.html?player=${player}&type=cpu`;
                };
                document.getElementById('btn-local').onclick = () => {
                    window.location.href = `games/${game}/index.html?player=${player}&type=local`;
                };
            }
        }
    </script>
</body>
</html>

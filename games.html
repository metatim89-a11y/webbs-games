<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick Game | Webbs Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lobby-container">
        <button onclick="location.href='index.html'">← Back</button>
        <h1 id="mode-title">Select Game</h1>
        <div class="game-grid" id="game-list">
            <button onclick="selectGame('tic-tac-toe')">Tic-Tac-Toe</button>
            <button onclick="selectGame('357')">357</button>
            <button onclick="selectGame('mancala')">Mancala</button>
            <button onclick="selectGame('black-hole')">Black Hole</button>
            <button onclick="selectGame('chutes-and-ladders')">Chutes & Ladders</button>
            <button onclick="selectGame('sorry')">Sorry</button>
            <button onclick="selectGame('uno-no-mercy')">Uno No Mercy</button>
        </div>

        <div id="sub-mode" style="display:none; position:fixed; top:30%; left:10%; width:80%; background:#222; padding:20px; border:2px solid gold;">
            <h3>Play Style:</h3>
            <button id="btn-cpu">vs. Computer</button>
            <button id="btn-local">Local Multiplayer</button>
            <button onclick="document.getElementById('sub-mode').style.display='none'">Cancel</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const player = params.get('player');
        const mode = params.get('mode'); // 'online' or 'local'
        document.body.classList.add('theme-' + player);

        function selectGame(game) {
            if (mode === 'online') {
                // Skip sub-mode, go straight to table creation
                window.location.href = `games/${game}/index.html?player=${player}&type=online`;
            } else {
                // Show choice for CPU or Local
                document.getElementById('sub-mode').style.display = 'block';
                document.getElementById('btn-cpu').onclick = () => {
                    window.location.href = `games/${game}/index.html?player=${player}&type=cpu`;
                };
                document.getElementById('btn-local').onclick = () => {
                    window.location.href = `games/${game}/index.html?player=${player}&type=local`;
                };
            }
        }
    </script>
</body>
</html>
